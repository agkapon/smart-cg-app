<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart CG - ระบบเยี่ยมบ้านผู้สูงอายุ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--p:#0f766e;--p2:#0d9488;--pl:#ccfbf1;--bg:#f5f3f0;--b:#cbd5e1;--t:#1e293b;--m:#64748b;--br:#8b6447}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--t);font-size:15px;-webkit-text-size-adjust:100%;display:flex;flex-direction:column;min-height:100vh}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f766e,#0891b2);padding:16px;width:100%;position:fixed;inset:0;z-index:200}
.lbox{background:#fff;padding:28px 24px;border-radius:16px;width:100%;max-width:380px;box-shadow:0 10px 40px #0003}
.lbox h1{margin:0 0 4px;color:var(--p);font-size:24px}
.lbox label{display:block;margin:12px 0;font-size:14px;color:var(--m);font-weight:600}
.lbox input,.lbox select{width:100%;margin-top:4px}
#app{display:none;flex:1;flex-direction:column}
.side{position:fixed;left:0;top:0;bottom:0;width:245px;background:#0f3d3a;color:#fff;padding:16px 0;overflow-y:auto;z-index:40;transition:transform .25s}
.brand{padding:0 18px 16px;font-weight:700;font-size:19px;border-bottom:1px solid #ffffff22;margin-bottom:8px}
.brand small{display:block;font-weight:300;font-size:11px;opacity:.8;margin-top:2px}
.side a{display:block;padding:12px 18px;color:#d1fae5;cursor:pointer;border-left:4px solid transparent;font-size:14px}
.side a:hover,.side a.act{background:#ffffff1a;color:#fff;border-left-color:#5eead4}
.main{margin-left:245px;padding:20px;flex:1}
.footer{margin-left:245px;text-align:center;padding:16px;font-size:13px;color:var(--m);border-top:1px solid #e2e8f0;background:#fff;margin-top:auto}

.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px #0000000a;border:1px solid #ece7e1}
h2{margin:0 0 14px;color:var(--p);font-size:19px}
h3{margin:0 0 10px;font-size:16px;color:#334155}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
input,select,textarea{font-family:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--b);border-radius:8px;background:#fff;width:100%;color:var(--t)}
textarea{min-height:70px}
button,.btnlike{font-family:inherit;font-size:14px;padding:9px 16px;border:0;border-radius:8px;background:var(--p);color:#fff;cursor:pointer;display:inline-block;font-weight:600;text-align:center}
button:hover{background:var(--p2)}button.sec{background:#e2e8f0;color:var(--t)}button.sec:hover{background:#cbd5e1}button.del{background:#dc2626}button.sm{padding:5px 10px;font-size:13px;width:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #e2e8f0;padding:7px 9px;text-align:left;vertical-align:middle}th{background:#f8fafc;font-weight:600;color:#334155}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-grn{background:#dcfce7;color:#166534}.b-amb{background:#fef3c7;color:#92400e}.b-red{background:#fee2e2;color:#991b1b}.b-blu{background:#dbeafe;color:#1e40af}.b-gry{background:#f1f5f9;color:#475569}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;font-size:13px;color:var(--m);gap:4px;font-weight:600}
.full{grid-column:1/-1}
.gps{display:flex;gap:6px}.gps input{flex:1;min-width:0}.gps button{white-space:nowrap;width:auto}
.q{border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:10px;background:#fafafa}
.q .opts{display:grid;gap:6px;margin-top:8px}.q label{cursor:pointer;font-weight:normal}
.chk-group{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:6px}
.chk-item{display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:13px;font-weight:normal;color:var(--t);background:#f8fafc;padding:8px 10px;border-radius:8px;border:1px solid #e2e8f0}
.chk-item input{margin-top:2px;width:18px;height:18px;accent-color:var(--p);flex-shrink:0}

.time-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tchip{border:1px solid var(--b);background:#fff;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;color:var(--t);transition:.1s}
.tchip.active{background:#fdf4ed;border-color:#b08968;color:#8b6447}

.score{position:sticky;top:0;background:var(--pl);padding:10px 14px;border-radius:10px;font-size:16px;margin-bottom:12px;z-index:2;font-weight:600;color:#042f2e;border:1px solid #5eead4}
.sch td,.sch th{padding:4px;text-align:center;font-size:12px;white-space:nowrap}
.sch td.nm{text-align:left}.sch td.d{cursor:pointer;min-width:24px}
.sch .off{background:#f1f5f9;color:#94a3b8}.sch td.on{background:#fde68a;font-weight:700}.sch td.done{background:#86efac;font-weight:700}.sch td.duty{background:#93c5fd;font-weight:700}
.sch tr.cgh td{background:#ccfbf1;font-weight:700;text-align:left;color:#0f766e}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:300}
#modal .box{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:780px;max-height:90vh;overflow-y:auto}
.mut{color:var(--m)}.err{color:#dc2626;font-size:13px}
.menu-btn{display:none;align-items:center;gap:6px;background:var(--p);color:#fff;border:0;padding:8px 14px;border-radius:8px;font-weight:600;margin-bottom:14px}
.report-header{text-align:center;margin-bottom:20px;display:none}
.thumb{width:42px;height:42px;object-fit:cover;border-radius:6px;border:1px solid #cbd5e1;cursor:pointer}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid #cbd5e1;cursor:pointer}

/* ===== DASHBOARD ===== */
.dhero{position:relative;overflow:hidden;background:linear-gradient(115deg,#4a3324 0%,#7d5a40 45%,#e2bd8f 100%);color:#fff;border-radius:22px;padding:22px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 10px 25px -10px #7d5a40}
.dhero:after{content:"";position:absolute;right:-60px;bottom:-90px;width:260px;height:260px;border-radius:50%;background:#ffffff14}
.dhero .ic{width:64px;height:64px;border-radius:16px;background:#ffffff26;display:grid;place-items:center;font-size:30px;flex-shrink:0;border:1px solid #ffffff33}
.dhero h1{margin:0;font-size:26px;font-weight:700}
.dhero p{margin:2px 0 0;opacity:.9;font-size:14px}
.dhero select{margin-left:auto;width:auto;min-width:210px;border-radius:12px;padding:11px 14px;border:0;position:relative;z-index:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:18px 0}
.kpi{background:#fff;border-radius:18px;padding:18px;display:flex;gap:14px;align-items:center;box-shadow:0 2px 10px #0000000d;border-top:5px solid var(--c)}
.kpi .ki{width:58px;height:58px;border-radius:16px;background:var(--g);display:grid;place-items:center;font-size:26px;flex-shrink:0;box-shadow:0 8px 16px -6px var(--c)}
.kpi b{font-size:30px;display:block;line-height:1.1;color:#0f172a}
.kpi span{display:block;color:#475569;font-weight:600;font-size:14px}
.kpi small{color:#64748b;font-size:12px}
.cgcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;margin-bottom:18px}
.cgc{background:#fff;border-radius:18px;padding:16px 18px;border-top:5px solid #b08968;box-shadow:0 2px 10px #0000000d}
.cgc .hd{display:flex;gap:12px;align-items:center}
.cgc .hd b{font-size:16px;display:block}
.cgc .hd small{color:#64748b;font-size:13px}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;flex-shrink:0}
.bar{height:9px;background:#f1f5f9;border-radius:9px;margin:14px 0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#8b6447,#d4a373)}
.cst{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:4px}
.cst b{font-size:21px;display:block;color:#0f172a}.cst b.red{color:#e11d48}
.cst small{color:#64748b;font-size:12px}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.obtn{background:#fff!important;border:1px solid #e2e8f0;color:#334155!important;border-radius:10px;padding:7px 12px;font-size:13px;width:auto!important}
.obtn:hover{background:#faf6f1!important;border-color:#d6c3ae}
.heat{background:#fff;border-radius:18px;border-top:5px solid #b08968;box-shadow:0 2px 10px #0000000d;overflow:hidden;margin-bottom:18px}
.heat .hh{display:flex;gap:12px;align-items:center;padding:16px 18px}
.heat .hh .ic2{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#d4a373,#8b6447);display:grid;place-items:center;font-size:20px}
.heat table{font-size:14px}.heat th{background:#faf6f1;border:0;border-bottom:1px solid #ece7e1;text-align:center;white-space:nowrap;padding:10px 8px}
.heat td{border:0;border-bottom:1px solid #f1ede8;text-align:center;padding:9px 8px;white-space:nowrap}
.heat td:first-child,.heat th:first-child{text-align:left;padding-left:18px;position:sticky;left:0;background:#fff;z-index:1}
.heat th:first-child{background:#faf6f1}
.hc{display:inline-block;min-width:40px;padding:5px 8px;border-radius:8px;font-weight:600;color:#3f2a1c}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#faf6f1;border:1px solid #ece7e1;border-radius:12px;padding:8px 14px;font-size:13px}
.chip b{font-size:18px;margin-left:4px;color:#5c4030}

/* ===== MAP / HISTORY / DETAIL ===== */
.mtabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#f1ece6;border-radius:14px;padding:6px;margin:16px 0}
.mtab{background:transparent;color:#5c4030;border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;width:auto}
.mtab:hover{background:#ffffff80}.mtab.act{background:#fff;box-shadow:0 1px 6px #0002}
.mtab .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.morg{margin-left:auto;color:#8b6447;font-size:13px;padding:0 10px}
.mapgrid{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start}
.mapcard{background:#fff;border-radius:18px;padding:10px;box-shadow:0 2px 10px #0000000d}
#leafletMap{width:100%;height:560px;border-radius:12px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.legend span{padding:5px 12px;border-radius:20px;font-size:13px;font-weight:600;border:1px solid}
.plist{background:#fff;border-radius:18px;border-top:5px solid #6366f1;box-shadow:0 2px 10px #0000000d;overflow:hidden}
.ph0{display:flex;gap:12px;align-items:center;padding:16px 18px;border-bottom:1px solid #f1ede8}.ph0 .ic2{width:42px;height:42px;border-radius:12px;background:#4f6df5;color:#fff;display:grid;place-items:center;font-size:18px}.ph0 small{display:block;color:#64748b;font-size:12px}
.pbody{max-height:600px;overflow-y:auto;padding:10px}
.pi{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid #ece7e1;border-radius:14px;margin-bottom:8px;cursor:pointer}.pi:hover{background:#faf6f1}
.pic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.pi.miss{border-color:#fecaca}.pi.miss .pic{box-shadow:0 0 0 3px #fff,0 0 0 5px #e11d48}
.pi small{display:block;color:#64748b;font-size:13px}.red{color:#e11d48;font-weight:600}
.pin{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px #0006;display:grid;place-items:center;font-size:17px}
.pin.miss{box-shadow:0 0 0 3px #e11d48,0 2px 6px #0006}
.hctl{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}.hctl select{margin-left:0!important}
.hbtn{background:#fff!important;color:#5c4030!important;border-radius:12px;padding:11px 16px;width:auto!important}
.vcard{display:flex;gap:16px;background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d;cursor:pointer;position:relative}
.vcard:hover{box-shadow:0 4px 16px #0000001f}
.vdt{width:62px;border-radius:14px;background:#faf6f1;text-align:center;padding:8px 4px;flex-shrink:0;align-self:flex-start}.vdt b{display:block;font-size:24px;line-height:1.1}.vdt small{font-size:12px;color:#64748b}
.vmain{padding-right:60px}.vmain b{font-size:16px}.vmain .sub{color:#64748b;font-size:14px;margin:3px 0 8px}
.vbadges{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;gap:4px;align-items:center;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;border:1px solid}
.vic{position:absolute;right:16px;top:14px;display:flex;gap:8px;font-size:16px}.vic span{opacity:.25}.vic span.on{opacity:1}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.dcard{background:#fff;border-radius:18px;box-shadow:0 2px 10px #0000000d;overflow:hidden;margin-bottom:18px;border-top:5px solid var(--c,#10b981)}
.dcard .dh{display:flex;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid #f1ede8}
.dcard .dh .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:18px;background:var(--c)}.dcard .dh b{font-size:18px}
.dcard .dbd{padding:16px 20px}
.chkl{list-style:none;margin:0;padding:0}.chkl li{padding:9px 0;border-bottom:1px dashed #e7e0db}.chkl li:before{content:'✓';color:#16a34a;font-weight:700;margin-right:10px}.chkl li:last-child{border:0}
.vts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.vt{background:#faf6f1;border:1px solid #ece7e1;border-radius:12px;padding:12px 14px}.vt small{color:#64748b;display:block;font-size:13px}.vt b{font-size:24px}.vt span{font-size:12px;color:#64748b;margin-left:4px}
.vt.bad{background:#fef2f2;border-color:#fecaca}.vt.bad b{color:#dc2626}
.vstat{margin-top:12px;font-weight:700}.vstat.ok{color:#16a34a}.vstat.bad{color:#dc2626}
.krow{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:8px 0}.krow span:first-child{color:#8b6447;font-weight:600}
.phs{display:flex;gap:10px;flex-wrap:wrap}.ph{width:110px;height:110px;border-radius:12px;background:#f1f5f9;display:grid;place-items:center;overflow:hidden;color:#94a3b8;font-size:12px;text-align:center;cursor:pointer}.ph img{width:100%;height:100%;object-fit:cover}
@media(max-width:1000px){.mapgrid{grid-template-columns:1fr}#leafletMap{height:420px}.dgrid{grid-template-columns:1fr}.krow{grid-template-columns:110px 1fr}.hctl{margin-left:0;width:100%}.morg{margin-left:0}}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
 .side{transform:translateX(-100%);box-shadow:5px 0 15px #0003}.side.open{transform:none}
 .main{margin-left:0;padding:12px}.footer{margin-left:0}
 .menu-btn{display:flex}
 .toolbar{flex-direction:column;align-items:stretch}.toolbar input,.toolbar select,.toolbar button{width:100%}
 .dhero{padding:18px;border-radius:18px}.dhero h1{font-size:21px}.dhero .ic{width:52px;height:52px;font-size:24px}
 .dhero select{margin-left:0;width:100%}
 .kpis{gap:10px}.kpi{padding:12px;gap:10px;flex-direction:column;align-items:flex-start}
 .kpi .ki{width:46px;height:46px;font-size:22px}.kpi b{font-size:24px}
 .cgcards{grid-template-columns:1fr}
}
@media print{
 .dhero{-webkit-print-color-adjust:exact;print-color-adjust:exact}.dgrid{grid-template-columns:1fr 1fr}.dcard{box-shadow:none;border:1px solid #ddd}.mtabs{display:none}
 .side,.toolbar,.noprint,.menu-btn,.footer{display:none!important}
 .main{margin:0;padding:0}.card{box-shadow:none;border:0;padding:0}
 body{background:#fff;font-size:12px}.report-header{display:block}
 @page{size:landscape;margin:8mm}
}
</style>
</head>
<body>
<div id="login"><form class="lbox" onsubmit="doLogin(event)">
<h1>Smart CG</h1><p class="mut">ระบบดูแลผู้สูงอายุและผู้มีภาวะพึ่งพิง<br>อบต.ชมเจริญ อ.ปากชม จ.เลย</p>
<label>ประเภทผู้ใช้งาน
<select id="lrole" onchange="toggleCgSel(this.value)">
<option value="admin">ผู้ดูแลระบบ (Admin)</option>
<option value="cg">อาสาสมัครดูแลผู้สูงอายุ (CG)</option>
</select></label>
<div id="cgSelBox" style="display:none"><label>เลือกชื่อ CG ของท่าน<select id="lcgId"></select></label></div>
<label>ชื่อผู้ใช้<input id="lu" autocomplete="username" required placeholder="กรอกชื่อผู้ใช้"></label>
<label>รหัสผ่าน<input id="lp" type="password" autocomplete="current-password" required placeholder="กรอกรหัสผ่าน"></label>
<div id="lerr" class="err"></div><button style="width:100%;margin-top:14px">เข้าสู่ระบบ</button><div style="text-align:center;margin-top:12px"><a href="#" onclick="gsModal();return false" style="font-size:13px;color:var(--p)">☁️ เชื่อมต่อ Google Sheet (สำหรับเครื่องใหม่)</a></div></form></div>

<div id="app">
  <nav class="side" id="sideNav">
    <div class="brand">Smart CG<small id="userRoleBadge">ศูนย์พัฒนาคุณภาพชีวิตฯ อบต.ชมเจริญ</small></div>
    <div id="nav"></div>
  </nav>
  <main class="main" id="main"></main>
  <footer class="footer">พัฒนาโดย นายเอกพล อาจโยธา ผอ.รพ.สต.บ้านห้วยอาลัย<br><small id="syncSt"></small></footer>
</div>
<div id="modal" onclick="if(event.target===this)closeM()"></div>

<script>
const KEY='smartcg_db_v10';
const TM=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TMS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
const GROUPS={0:'ไม่เข้าเกณฑ์/ติดสังคม',1:'กลุ่ม 1',2:'กลุ่ม 2',3:'กลุ่ม 3',4:'กลุ่ม 4'};

/* ติดตามรายการที่ถูกเพิ่ม/แก้/ลบ เพื่อส่งขึ้น Google Sheet */
function hsh(o){const s=JSON.stringify(o,(k,v)=>k==='_u'?undefined:v);let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h+':'+s.length}
function recMap(d,c){if(c==='schedules')return d.schedules||{};if(c==='settings')return d.settings?{settings:d.settings}:{};const m={};(d[c]||[]).forEach(r=>m[r.id]=r);return m}
function stamp(){const t=Date.now(),first=!db._h;db._h=db._h||{};db.del=db.del||{};db._d=db._d||{};
 ALLC.forEach(c=>{const m=recMap(db,c),H=db._h[c]=db._h[c]||{};
  for(const id in m){const r=m[id];if(!r||typeof r!=='object')continue;const h=hsh(r);if(H[id]!==h){if(!first){r._u=t;delete db.del[c+':'+id];db._d[c+':'+id]=t}H[id]=h}}
  for(const id in H)if(!(id in m)){if(!first&&c!=='settings'){db.del[c+':'+id]=t;db._d[c+':'+id]=t}delete H[id]}})}
function markAllDirty(){stamp();const t=Date.now();ALLC.forEach(c=>{const m=recMap(db,c);for(const id in m){const r=m[id];if(r&&typeof r==='object'){r._u=r._u||t;db._d[c+':'+id]=r._u}}});persist()}

function localRec(c,id){return c==='settings'?db.settings:c==='schedules'?db.schedules[id]:(db[c]||[]).find(r=>r.id===id)}
function setRec(c,id,d){if(c==='settings')db.settings=d;else if(c==='schedules')db.schedules[id]=d;else{const a=db[c]=db[c]||[],i=a.findIndex(r=>r.id===id);i>=0?a[i]=d:a.push(d)}}
function removeRec(c,id){if(c==='schedules')delete db.schedules[id];else if(c!=='settings')db[c]=(db[c]||[]).filter(r=>r.id!==id)}
function applyRows(rows){let n=0,sets=false;const H=c=>(db._h[c]=db._h[c]||{});
 rows.forEach(r=>{const c=r.c,id=r.id,key=c+':'+id;if(!ALLC.includes(c))return;
  const cur=localRec(c,id),cu=cur?(cur._u||0):0;
  if(r.del){if(cur&&r._u>=cu){removeRec(c,id);delete H(c)[id];delete db._d[key];db.del[key]=r._u;n++}else if(!cur)db.del[key]=Math.max(db.del[key]||0,r._u);return}
  if(cur&&!(r._u>cu))return;
  const d=r.data;d._u=r._u;if(c==='visits'&&cur&&cur.photos&&cur.photos.length)d.photos=cur.photos;
  setRec(c,id,d);H(c)[id]=hsh(d);delete db._d[key];delete db.del[key];n++;if(c==='settings')sets=true});
 if(n){normDb();if(sets)H('settings').settings=hsh(db.settings)}
 return n}
function enrich(c,d,r){
 if(c==='patients')d.cgName=cgName(r.cgId);
 if(c==='visits'){d.pName=(P(r.pid)||{}).name||'';d.cgName=cgName(r.cgId);d.nPhotos=Math.max((r.photos||(r.photo?[r.photo]:[])).length,(r.photoIds||[]).length,+r.nPhotos||0)}
 if(c==='adl'||c==='tai')d.pName=(P(r.pid)||{}).name||'';
 if(c==='schedules')d.month=r.id||''}
function buildDirty(){const out=[],keys=[];
 for(const key in db._d){const i=key.indexOf(':'),c=key.slice(0,i),id=key.slice(i+1),r=recMap(db,c)[id],tomb=db.del[key];
  if(r){const d=JSON.parse(JSON.stringify(r,(k,v)=>k==='photos'||k==='photo'?undefined:v));if(c==='schedules')d.month=id;enrich(c,d,r);if(c==='schedules')d.month=id;out.push({c,id,_u:r._u||Date.now(),data:d});keys.push([key,db._d[key]])}
  else if(tomb){out.push({c,id,_u:tomb,del:1});keys.push([key,db._d[key]])}
  else delete db._d[key]}
 return{out,keys}}

async function gsCall(body){const c=gsCfg(),ac=new AbortController(),tm=setTimeout(()=>ac.abort(),40000);
 try{const r=await fetch(c.url,{method:'POST',body:JSON.stringify(Object.assign({key:c.key},body)),signal:ac.signal});
  if(!r.ok)throw new Error('เซิร์ฟเวอร์ตอบกลับผิดพลาด ('+r.status+')');
  let j;try{j=await r.json()}catch(e){throw new Error('ตอบกลับไม่ถูกต้อง ตรวจว่า URL เป็นของ Web App (ลงท้าย /exec) และตั้งสิทธิ์เป็น "Anyone"')}
  if(!j.ok)throw new Error(j.err||'เกิดข้อผิดพลาด');return j}finally{clearTimeout(tm)}}

async function uploadPhotos(){let n=0;for(const v of db.visits){const loc=v.photos||(v.photo?[v.photo]:[]);if(!loc.length)continue;const ids=v.photoIds||[];if(ids.length>=loc.length)continue;
  for(let i=ids.length;i<loc.length;i++){const r=await gsCall({action:'upphoto',vid:v.id,idx:i,data:loc[i]});ids[i]=r.id;v.photoIds=ids;n++;persist()}}return n}
async function syncNow(manual){
 if(!gsCfg()||!db)return '';
 if(gsBusy){gsAgain=true;return ''}
 gsBusy=true;setStatus('⏳ กำลังซิงค์...');let err='',applied=false,rej=0;
 try{
  const st=gsState(),pr=await gsCall({action:'pull',since:st.cursor||0});
  stamp();if(applyRows(pr.rows||[])){applied=true;persist()}
  st.cursor=pr.t;st.role=pr.role;st.cgId=pr.cgId;localStorage.setItem(GSS,JSON.stringify(st));
  let perr='';try{await uploadPhotos()}catch(e){perr=gsErr(e)}
  for(let g=0;g<50;g++){stamp();const {out,keys}=buildDirty();if(!out.length)break;
   const bo=out.slice(0,60),bk=keys.slice(0,60),r=await gsCall({action:'push',recs:bo});
   bk.forEach(([k,v])=>{if(db._d[k]===v)delete db._d[k]});persist();rej+=(r.rejected||[]).length}
  if(!rej&&perr)err='ส่งข้อมูลแล้ว แต่อัปโหลดรูปไม่สำเร็จ: '+perr;
  if(rej)err='มี '+rej+' รายการที่เซิร์ฟเวอร์ไม่รับ (ไม่มีสิทธิ์หรือข้อมูลใหญ่เกินไป)'
 }catch(e){err=gsErr(e)}
 gsBusy=false;
 err?setStatus('⚠️ '+err,'#dc2626'):setStatus('☁️ ซิงค์แล้ว '+hm(),'#059669');
 if(applied){const lg=$('#login');if(lg&&lg.style.display!=='none')fillCgLogin();refreshView()}
 if(gsAgain){gsAgain=false;setTimeout(()=>syncNow(),300)}
 return err}

async function gsConnect(){
 const url=$('#gsU').value.trim(),key=$('#gsK').value.trim(),er=$('#gserr');
 if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url))return er.textContent='URL ไม่ถูกต้อง ต้องขึ้นต้น https://script.google.com/ และลงท้าย /exec';
 if(!key)return er.textContent='กรุณากรอกรหัส (Key)';
 er.style.color='#64748b';er.textContent='⏳ กำลังทดสอบการเชื่อมต่อ...';
 const old={k:localStorage.getItem(GSK),s:localStorage.getItem(GSS)};
 try{localStorage.setItem(GSK,JSON.stringify({url,key}));localStorage.removeItem(GSS);
  const w=await gsCall({action:'whoami'});localStorage.setItem(GSS,JSON.stringify({cursor:0,role:w.role,cgId:w.cgId}));
  if(w.role==='admin'&&(db.patients.length||db.cgs.length)&&confirm('ส่งข้อมูลที่มีอยู่ในเครื่องนี้ขึ้น Google Sheet ด้วยหรือไม่?\n\nตกลง = ส่งขึ้นทั้งหมด (ทำครั้งแรกครั้งเดียว)\nยกเลิก = ไม่ส่ง (ดึงข้อมูลจาก Google Sheet อย่างเดียว)'))markAllDirty();
  const e=await syncNow(true);if(e)throw new Error(e);
  closeM();if($('#login').style.display!=='none')fillCgLogin();else refreshView(true);
  alert('เชื่อมต่อสำเร็จ ('+(w.role==='admin'?'ผู้ดูแลระบบ':'CG: '+w.name)+')');if($('#app').style.display!=='none'&&curPage==='set')rSet()
 }catch(e){er.style.color='#dc2626';er.textContent='เชื่อมต่อไม่สำเร็จ: '+gsErr(e);
  old.k===null?localStorage.removeItem(GSK):localStorage.setItem(GSK,old.k);old.s===null?localStorage.removeItem(GSS):localStorage.setItem(GSS,old.s)}}
function gsCard(){const c=gsCfg(),st=gsState(),on=!!c;
 return `<div class="card"><h3>☁️ ซิงค์ข้อมูลกับ Google Sheet</h3>
 <p class="mut">${on?`เชื่อมต่อแล้ว · สิทธิ์: <b>${st.role==='admin'?'ผู้ดูแลระบบ':st.role==='cg'?'CG':'-'}</b><br>เมื่อมีการบันทึก ระบบส่งขึ้น Google Sheet อัตโนมัติ และดึงข้อมูลใหม่ของเครื่องอื่นทุกประมาณ 90 วินาที<br>รูปถ่ายการเยี่ยมจะถูกอัปโหลดไปเก็บใน Google Drive ของผู้ดูแลระบบ (โฟลเดอร์ SmartCG-Photos)`:'ยังไม่ได้เชื่อมต่อ กด "เชื่อมต่อ Google Sheet" แล้วกรอก URL และรหัส (Key)'}</p>

async function gsPushAllUi(){if(!confirm('ส่งข้อมูลทั้งหมดในเครื่องนี้ขึ้น Google Sheet (รายการที่ใหม่กว่าใน Sheet จะไม่ถูกทับ) ยืนยัน?'))return;const e=await gsPushAll();alert(e||'ส่งข้อมูลเรียบร้อย')}

 if(role==='admin'){

function monthOpts(sel){const keys=new Set();let h='';
 for(let fy=2572;fy>=2569;fy--){let o='';for(let i=11;i>=0;i--){const y0=fy-544,mm=10+i,y=mm>12?y0+1:y0,m=mm>12?mm-12:mm,k=mkey(y,m);keys.add(k);o+=`<option value="${k}" ${k===sel?'selected':''}>${TM[m-1]} ${y+543}</option>`}h+=`<optgroup label="ปีงบประมาณ ${fy}">${o}</optgroup>`}
 if(!keys.has(sel))h=`<option value="${sel}" selected>${thMonth(sel)}</option>`+h;return h}
function monthsBack(key,n){let [y,m]=key.split('-').map(Number);const r=[];for(let i=0;i<n;i++){r.unshift(mkey(y,m));m--;if(m<1){m=12;y--}}return r}
function missedOf(p,key){const sch=db.schedules[key];if(!sch)return 0;const ds=sch.visits[p.id]||[];const t=new Date(),tk=mkey(t.getFullYear(),t.getMonth()+1);let cut;
 if(key<tk)cut=99;else if(key===tk)cut=t.getDate()-1;else return 0;
 const due=ds.filter(d=>d<=cut).length,done=db.visits.filter(v=>v.pid===p.id&&v.date.startsWith(key)).length;return Math.max(0,due-done)}
function cgStat(c,key){const ps=activeP().filter(p=>p.cgId===c.id),vs=db.visits.filter(v=>v.cgId===c.id&&v.date.startsWith(key)),seen=new Set(vs.map(v=>v.pid));
 return{c,ps,vs,got:ps.filter(p=>seen.has(p.id)).length,hrs:vs.reduce((a,v)=>a+vHrs(v),0),missed:ps.filter(p=>missedOf(p,key)>0).length,
  bed:ps.filter(p=>hasAdl(p)&&+p.adl<=4).length,home:ps.filter(p=>hasAdl(p)&&+p.adl>=5&&+p.adl<=11).length}}
function kpi(icon,val,label,sub,c,g){return `<div class="kpi" style="--c:${c};--g:${g}"><div class="ki">${icon}</div><div><b>${val}</b><span>${label}</span><small>${sub}</small></div></div>`}

 const totP=st.reduce((a,s)=>a+s.ps.length,0),totV=st.reduce((a,s)=>a+s.vs.length,0),totH=st.reduce((a,s)=>a+s.hrs,0),totM=st.reduce((a,s)=>a+s.missed,0);

 db.visits.forEach(v=>{const k=v.date.slice(0,7);(cnt[v.cgId]=cnt[v.cgId]||{})[k]=(cnt[v.cgId][k]||0)+1});
 let max=1;cgs.forEach(c=>months.forEach(k=>{max=Math.max(max,(cnt[c.id]||{})[k]||0)}));
 const act=isCG?activeP().filter(p=>p.cgId===currentUser.cgId):activeP(),g=[1,2,3,4].map(i=>act.filter(p=>+p.group===i).length);

 const n=new Date(),tk=mkey(n.getFullYear(),n.getMonth()+1),sch=db.schedules[tk],td=n.getDate(),tdIso=todayISO();let today=[];
 if(sch)Object.entries(sch.visits).forEach(([pid,ds])=>{const p=P(pid);if(p&&p.status!=='inactive'&&(!isCG||p.cgId===currentUser.cgId)&&ds.includes(td))today.push(p)});
 const duty=sch?cgs.filter(c=>sch.duty[c.id]===td):[];

 M(`<div class="dhero"><div class="ic">👥</div><div><h1>แดชบอร์ด Caregiver</h1><p>การเยี่ยมราย Caregiver เดือน${thMonth(key)} · ย้อนหลัง 12 เดือน</p></div>
 <select onchange="state.dm=this.value;rDash()">${monthOpts(key)}</select></div>

 <div class="kpis">
 ${kpi('👥',cgs.length,'Caregiver',`ดูแล ${totP} ราย`,'#a47148','linear-gradient(135deg,#c08a5b,#7d5a40)')}
 ${kpi('➕',totV,'ครั้งที่เยี่ยมเดือนนี้',`เฉลี่ย ${cgs.length?fmtH(totV/cgs.length):0} ครั้ง/คน`,'#10b981','linear-gradient(135deg,#34d399,#059669)')}
 ${kpi('⏱️',fmtH(totH),'ชั่วโมงให้บริการ','จากเวลาที่บันทึก','#3b82f6','linear-gradient(135deg,#60a5fa,#4f46e5)')}
 ${kpi('🔔',totM,'ขาดการเยี่ยม (ราย)','ณ วันนี้ เทียบกับตารางนัด','#f43f5e','linear-gradient(135deg,#fb7185,#e11d48)')}
 </div>

  <div class="hd"><div class="av" style="background:${AVC[db.cgs.indexOf(s.c)%AVC.length]}">${initial(s.c.name)}</div><div><b>${esc(s.c.name)}</b><small>ดูแล ${s.ps.length} ราย · ติดเตียง ${s.bed} · ติดบ้าน ${s.home}</small></div></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="cst"><div><b>${s.vs.length}</b><small>ครั้งที่เยี่ยม</small></div><div><b>${s.got}/${s.ps.length}</b><small>ได้รับเยี่ยม</small></div><div><b class="${s.missed?'red':''}">${s.missed}</b><small>ขาดเยี่ยม</small></div><div><b>${fmtH(s.hrs)}</b><small>ชั่วโมง</small></div></div>
  <div class="acts"><button class="obtn" onclick="state.vm='${key}';state.vcg='${s.c.id}';go('visit')">☰ การเยี่ยม</button><button class="obtn" onclick="printClaim('${s.c.id}','${key}')">📄 รายงานเบิก</button></div></div>`}).join('')||'<div class="card">ยังไม่มีข้อมูล CG</div>'}</div>

 <div class="heat"><div class="hh"><div class="ic2">📅</div><div><b style="font-size:17px">จำนวนครั้งที่เยี่ยม ย้อนหลัง 12 เดือน</b><br><small class="mut">สีเข้ม = เยี่ยมมาก</small></div></div>
 <div class="tw"><table><tr><th>Caregiver</th>${months.map(k=>{const [y,m]=k.split('-').map(Number);return `<th>${TMS[m-1]} ${String(y+543).slice(2)}</th>`}).join('')}<th>รวม</th></tr>
 ${cgs.map(c=>{let sum=0;return `<tr><td><b>${esc(c.name)}</b></td>${months.map(k=>{const v=(cnt[c.id]||{})[k]||0;sum+=v;const a=v?0.12+0.6*v/max:0.04;return `<td><span class="hc" style="background:rgba(139,100,71,${a.toFixed(2)})">${v}</span></td>`}).join('')}<td><b>${sum}</b></td></tr>`}).join('')}</table></div></div>

 <div class="card"><h3>👴 สรุปผู้สูงอายุในความดูแล (${act.length} ราย)</h3><div class="chips">
 <div class="chip">กลุ่ม 1<b>${g[0]}</b></div><div class="chip">กลุ่ม 2<b>${g[1]}</b></div><div class="chip">กลุ่ม 3<b>${g[2]}</b></div><div class="chip">กลุ่ม 4<b>${g[3]}</b></div>

 <div class="card"><h3>📌 งานและนัดหมายวันนี้ (${thDate(tdIso)})</h3>
 ${!sch?`<p class="mut">ยังไม่ได้สร้างตารางเยี่ยมบ้านของเดือนนี้ ${!isCG?`<button class="sm" onclick="go('sch')">ไปสร้างตาราง</button>`:''}</p>`:''}
 ${duty.length?`<p>🏢 เวรประจำศูนย์วันนี้: <b>${duty.map(c=>esc(c.name)).join(', ')}</b></p>`:''}
 ${today.length?`<div class="tw"><table><tr><th>ผู้สูงอายุ</th><th>หมู่</th><th>กลุ่ม</th><th>CG</th><th>สถานะ</th><th></th></tr>${today.map(p=>{const ok=db.visits.some(v=>v.pid===p.id&&v.date===tdIso);return `<tr><td>${esc(p.name)}</td><td>ม.${esc(p.moo)}</td><td>${p.group}</td><td>${esc(cgName(p.cgId))}</td><td>${ok?'<span class="badge b-grn">เยี่ยมแล้ว</span>':'<span class="badge b-amb">รอเยี่ยม</span>'}</td><td>${ok?'':`<button class="sm" onclick="startVisit('${p.id}','${tdIso}')">บันทึกเยี่ยม</button>`}</td></tr>`}).join('')}</table></div>`:(sch?'<p class="mut">ไม่มีนัดเยี่ยมบ้านวันนี้</p>':'')}</div>`)}

function printClaim(cgId,key){const c=db.cgs.find(x=>x.id===cgId);if(!c)return;const S=db.settings;
 const vs=db.visits.filter(v=>v.cgId===cgId&&v.date.startsWith(key)).sort((a,b)=>a.date.localeCompare(b.date));
 const sch=db.schedules[key],dd=sch&&sch.duty[cgId];let tot=0;
 const rows=vs.map((v,i)=>{const p=P(v.pid)||{},h=vHrs(v);tot+=h;return `<tr><td>${i+1}</td><td>${thDate(v.date)}</td><td class="l">${esc(p.name||'-')}</td><td>${p.group??''}</td><td>${v.tStart&&v.tEnd?v.tStart+' - '+v.tEnd:'-'}</td><td>${fmtH(h)}</td><td class="l">${esc([...(v.help||[]),v.helpOther].filter(Boolean).join(', '))}</td></tr>`}).join('');
 if(dd)tot+=+S.dutyHrs||0;

function savePat(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const err=t=>$('#perr').textContent=t;
 f.cid=(f.cid||'').replace(/\D/g,'');f.name=f.name.trim();

 if(f.cid&&db.patients.some(p=>p.cid===f.cid&&p.id!==id))return err('เลขบัตรประชาชนนี้มีในระบบแล้ว');
 if(currentUser.role==='cg')f.cgId=currentUser.cgId;
 f.group=+f.group;f.adl=f.adl===''?'':+f.adl;if(!f.sex)f.sex=guessSex(f.name);

function rAdl(){const pid=state.pre||'';state.pre=null;
 M(`<h2>แบบประเมิน Barthel ADL Index</h2><div class="card"><div class="form">
 <label class="full">เลือกผู้ป่วย *<select id="ap" onchange="adlHist()">${patOpts(pid)}</select></label>

 <label>ผู้ประเมิน<input id="aby" value="${esc(currentUser.name)}"></label></div></div>
 <div class="card"><div class="score" id="ascore">คะแนนรวม: 0 / 20 (ยังไม่ประเมิน)</div>
 ${ADL_ITEMS.map((it,i)=>`<div class="q"><b>${it[0]}</b><div class="opts">${it[1].map((o,s)=>`<label class="chk-item"><input type="radio" name="a${i}" value="${s}" onchange="adlCalc()"><span><b>${s} คะแนน:</b> ${o}</span></label>`).join('')}</div></div>`).join('')}
 <button onclick="saveAdl()">💾 บันทึก ADL</button></div>

function adlVals(){return ADL_ITEMS.map((_,i)=>{const r=document.querySelector(`input[name=a${i}]:checked`);return r?+r.value:null})}
function adlCalc(){const v=adlVals(),s=v.reduce((a,b)=>a+(b||0),0),n=v.filter(x=>x!==null).length,[c,cl]=adlCat(s);$('#ascore').innerHTML=`คะแนนรวม: <b>${s}</b> / 20 ${n===10?`<span class="badge ${cl}">${c}</span>`:`<span class="mut">(ตอบ ${n}/10)</span>`}`}
function saveAdl(){const pid=$('#ap').value,v=adlVals();if(!pid)return alert('กรุณาเลือกผู้ป่วย');if(v.includes(null))return alert('กรุณาประเมินให้ครบ 10 ข้อ');
 const s=v.reduce((a,b)=>a+b,0),date=$('#adate').value;db.adl.push({id:uid(),pid,date,items:v,score:s,by:$('#aby').value});

function holSet(){const s=new Set();(db.settings.holidays||'').split(/\s+/).forEach(l=>{const m=l.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m){let y=+m[1];if(y>2400)y-=543;s.add(`${y}-${pad(m[2])}-${pad(m[3])}`)}});return s}
function workDays(y,m){const n=new Date(y,m,0).getDate(),h=holSet(),r=[];for(let d=1;d<=n;d++){const w=new Date(y,m-1,d).getDay();if(!db.settings.weekend&&(w===0||w===6))continue;if(h.has(`${y}-${pad(m)}-${pad(d)}`))continue;r.push(d)}return r}
function genSch(){const key=mkey(state.y,state.m);if(db.schedules[key]&&!confirm('มีตารางเดือนนี้แล้ว ต้องการสร้างใหม่ทับหรือไม่?'))return;
 const days=workDays(state.y,state.m);if(!days.length)return alert('ไม่มีวันทำงานในเดือนนี้');
 const sch={created:new Date().toISOString(),visits:{},duty:{}},n=Math.max(db.cgs.length,1);
 db.cgs.forEach((c,ci)=>sch.duty[c.id]=days[Math.floor((ci+0.5)*days.length/n)%days.length]);
 db.cgs.forEach(c=>{const avail=days.filter(d=>d!==sch.duty[c.id]),ld={};avail.forEach(d=>ld[d]=0);
  activeP().filter(p=>p.cgId===c.id).sort((a,b)=>visitsNeeded(b.group)-visitsNeeded(a.group)).forEach(p=>{const k=visitsNeeded(p.group),got=[];
   for(let j=0;j<k;j++){const lo=Math.floor(j*avail.length/k),hi=Math.max(lo,Math.floor((j+1)*avail.length/k)-1);let best=null;
    for(let i=lo;i<=hi&&i<avail.length;i++){const d=avail[i];if(got.includes(d))continue;if(best===null||ld[d]<ld[best])best=d}
    if(best!==null){got.push(best);ld[best]++}}
   sch.visits[p.id]=got.sort((a,b)=>a-b)})});
 db.schedules[key]=sch;save();rSch()}
function tg(pid,d){if(currentUser.role==='cg')return;const s=db.schedules[mkey(state.y,state.m)];if(!s)return;const a=s.visits[pid]||(s.visits[pid]=[]),i=a.indexOf(d);i>=0?a.splice(i,1):(a.push(d),a.sort((x,y)=>x-y));save();rSch()}
function tgDuty(cg,d){if(currentUser.role==='cg')return;const s=db.schedules[mkey(state.y,state.m)];if(!s)return;s.duty[cg]=s.duty[cg]===d?null:d;save();rSch()}

 M(h+'</table></div></div>')}

 <label class="full">ปัญหา / อุปสรรค<textarea name="problem"></textarea></label>
 <label class="full">วิธีแก้ไข / ข้อเสนอแนะ<textarea name="solution"></textarea></label>
 <div class="full"><button type="submit" style="width:100%">💾 บันทึกรายงานการเยี่ยม</button></div></form></div>
 <div class="card" id="vlist"></div>`);
 vPats(pre.pid);vInfo();vList();getVGps(true)}

function vPats(sel){const c=$('#vc').value,ps=activeP().filter(p=>!c||p.cgId===c);$('#vp').innerHTML='<option value="">- เลือกผู้สูงอายุ -</option>'+ps.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)} (ม.${esc(p.moo)} กลุ่ม ${p.group})</option>`).join('');vInfo()}
function vInfo(){const p=P($('#vp').value),d=$('#vd').value;if(!p||!d){$('#vi').innerHTML='';return}
 const key=d.slice(0,7),sch=db.schedules[key],ds=sch?(sch.visits[p.id]||[]):[],cnt=db.visits.filter(v=>v.pid===p.id&&v.date.startsWith(key)).length,[c,cl]=adlCat(p.adl);
 
 const lastV=db.visits.filter(v=>v.pid===p.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
 if(lastV){
  if($('#vBpS')&&lastV.bpS)$('#vBpS').placeholder=`ครั้งก่อน ${lastV.bpS}`;
  if($('#vBpD')&&lastV.bpD)$('#vBpD').placeholder=`ครั้งก่อน ${lastV.bpD}`;
  if($('#vPulse')&&lastV.pulse)$('#vPulse').placeholder=`ครั้งก่อน ${lastV.pulse}`;
  if($('#vTemp')&&lastV.temp)$('#vTemp').placeholder=`ครั้งก่อน ${lastV.temp}`;
  if($('#vResp')&&lastV.resp)$('#vResp').placeholder=`ครั้งก่อน ${lastV.resp}`;
  if($('#vSpo2')&&lastV.spo2)$('#vSpo2').placeholder=`ครั้งก่อน ${lastV.spo2}`;
  if($('#vBs')&&lastV.bs)$('#vBs').placeholder=`ครั้งก่อน ${lastV.bs}`;
  if($('#vWeight')&&lastV.weight)$('#vWeight').placeholder=`ครั้งก่อน ${lastV.weight}`;
 }

 $('#vi').innerHTML=`<div class="q" style="background:#f0fdfa;border-color:#99f6e4">อายุ <b>${age(p.birth)||'-'}</b> ปี | ${p.sex||'-'} | ADL <b>${p.adl??'-'}</b> <span class="badge ${cl}">${c}</span> | TAI <b>${p.tai||'-'}</b> | กลุ่ม <b>${p.group}</b> | โรค: ${esc(p.disease||'-')}<br>${p.lat&&p.lng?`<a href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank" style="color:#0f766e;font-weight:700">📍 เปิดแผนที่นำทาง</a><br>`:''}นัดเดือนนี้: ${ds.length?ds.map(x=>'วันที่ '+x).join(', '):'ไม่มีในตาราง'} | ครั้งนี้เป็นครั้งที่ <b>${cnt+1}</b> ของเดือน</div>`}

function saveVisit(e){e.preventDefault();const fd=new FormData(e.target);
 const mins=+fd.get('mins')||60;
 const v={id:uid(),created:Date.now(),date:fd.get('date'),cgId:currentUser.role==='cg'?currentUser.cgId:$('#vc').value,pid:fd.get('pid'),tStart:fd.get('tStart'),mins:mins,bpS:fd.get('bpS'),bpD:fd.get('bpD'),pulse:fd.get('pulse'),temp:fd.get('temp'),resp:fd.get('resp'),spo2:fd.get('spo2'),bs:fd.get('bs'),weight:fd.get('weight'),lat:fd.get('vlat')||'',lng:fd.get('vlng')||'',acc:fd.get('vacc')||'',photos:tempVisitPhotos,help:fd.getAll('help'),helpOther:(fd.get('helpOther')||'').trim(),sat:fd.get('sat'),problem:(fd.get('problem')||'').trim(),solution:(fd.get('solution')||'').trim()};
 if(!v.pid)return alert('กรุณาเลือกผู้สูงอายุ');
 db.visits.push(v);if(!save()){db.visits.pop();return}alert('บันทึกการเยี่ยมเรียบร้อย');state.vm=v.date.slice(0,7);state.pre={cg:v.cgId,date:v.date};tempVisitPhotos=[];rVisit()}
function visitNo(v){return db.visits.filter(x=>x.pid===v.pid&&x.date.slice(0,7)===v.date.slice(0,7)).sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created).findIndex(x=>x.id===v.id)+1}
function vRows(){return db.visits.filter(v=>v.date.startsWith(state.vm)&&(currentUser.role!=='cg'||v.cgId===currentUser.cgId)&&(!state.vcg||currentUser.role==='cg'||v.cgId===state.vcg)).sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created)}
function vList(){const list=vRows();
 $('#vlist').innerHTML=`<div class="report-header"><h3>${db.settings.orgName}</h3><h3>รายงานการดูแลผู้สูงอายุที่บ้าน ประจำเดือน ${thMonth(state.vm)}</h3></div>
 <div class="toolbar noprint"><input type="month" style="width:auto" value="${state.vm}" onchange="if(this.value){state.vm=this.value;vList()}">
 ${currentUser.role==='admin'?`<select style="width:auto" onchange="state.vcg=this.value;vList()">${cgOpts(state.vcg,'CG ทั้งหมด')}</select>`:''}
 <button class="sec" onclick="window.print()">🖨️ พิมพ์</button><button class="sec" onclick="csvVisits()">⬇️ CSV</button></div>
 <h3>📋 รายการเยี่ยมบ้าน ${thMonth(state.vm)} (${list.length} ครั้ง)</h3>
 <div class="tw"><table><tr><th>#</th><th>วันที่</th><th>รูป</th><th>ครั้ง</th><th>ชื่อ-สกุล</th><th>ความดัน</th><th>ชีพจร</th><th>ชม.</th><th>กิจกรรม</th><th>พอใจ</th><th>CG</th><th class="noprint"></th></tr>
 ${list.map((v,i)=>{const p=P(v.pid)||{},arr=v.photos||(v.photo?[v.photo]:[]);return `<tr><td>${i+1}</td><td style="white-space:nowrap">${thDate(v.date)}</td><td>${arr.length?`<img src="${arr[0]}" class="thumb" onclick="showPhotos('${v.id}')"><small style="display:block">(${arr.length})</small>`:'-'}</td><td><b>${visitNo(v)}</b></td><td><b>${esc(p.name||'-')}</b></td><td>${v.bpS?esc(v.bpS)+'/'+esc(v.bpD):'-'}</td><td>${v.pulse||'-'}</td><td>${fmtH(vHrs(v))}</td><td><small>${esc([...(v.help||[]),v.helpOther].filter(Boolean).join(', '))}</small></td><td>${esc(v.sat)}</td><td>${esc(cgName(v.cgId))}</td><td class="noprint"><button class="sm sec" onclick="openVisit('${v.id}')">ดู</button> <button class="sm del" onclick="if(confirm('ลบบันทึกนี้?')){db.visits=db.visits.filter(x=>x.id!=='${v.id}');save();vList()}">ลบ</button></td></tr>`}).join('')||'<tr><td colspan="12" class="mut" style="text-align:center">ยังไม่มีบันทึก</td></tr>'}</table></div>`}
function csvVisits(){const rows=[['ลำดับ','วันที่','ครั้งที่','ชื่อ-สกุล','เวลา','ชั่วโมง','ความดัน','ชีพจร','อุณหภูมิ','ออกซิเจน','น้ำตาล','น้ำหนัก','กิจกรรม','ความพอใจ','ปัญหา','วิธีแก้ไข','CG']];
 vRows().forEach((v,i)=>{const p=P(v.pid)||{};rows.push([i+1,thDate(v.date),visitNo(v),p.name,v.tStart,fmtH(vHrs(v)),v.bpS?v.bpS+'/'+v.bpD:'',v.pulse,v.temp,v.spo2,v.bs,v.weight,[...(v.help||[]),v.helpOther].filter(Boolean).join(', '),v.sat,v.problem,v.solution,cgName(v.cgId)])});
 dl(`บันทึกเยี่ยมบ้าน_${state.vm}.csv`,toCSV(rows),'text/csv;charset=utf-8')}

/* ---------- REPORT ---------- */
function rReport(){const act=activeP(),tot=act.length,g=[0,1,2,3,4].map(i=>act.filter(p=>+p.group===i).length),a={s:0,h:0,b:0,n:0};
 act.forEach(p=>{if(!hasAdl(p))a.n++;else +p.adl>=12?a.s++:+p.adl>=5?a.h++:a.b++});
 const pc=x=>tot?(x/tot*100).toFixed(1)+'%':'0%';
 M(`<div class="report-header"><h3>${db.settings.orgName}</h3><h3>รายงานสรุปภาพรวมผู้สูงอายุและผู้ที่มีภาวะพึ่งพิง</h3></div>
 <h2>📊 รายงานสรุปภาพรวม</h2><div class="card noprint"><button class="sec" onclick="window.print()">🖨️ พิมพ์รายงาน</button></div>
 <div class="card"><h3>1. จำแนกตามกลุ่มการดูแล</h3><div class="tw"><table><tr><th>กลุ่ม</th><th>ความถี่การเยี่ยม</th><th>จำนวน</th><th>ร้อยละ</th></tr>
 ${[1,2,3,4,0].map(i=>`<tr><td>${GROUPS[i]}</td><td>${visitsNeeded(i)} ครั้ง/เดือน</td><td><b>${g[i]}</b></td><td>${pc(g[i])}</td></tr>`).join('')}
 <tr style="background:#f8fafc"><td colspan="2"><b>รวม</b></td><td><b>${tot}</b></td><td>100%</td></tr></table></div></div>
 <div class="card"><h3>2. ระดับ ADL</h3><div class="tw"><table><tr><th>ระดับ</th><th>คะแนน</th><th>จำนวน</th><th>ร้อยละ</th></tr>
 <tr><td><span class="badge b-grn">ติดสังคม</span></td><td>12-20</td><td><b>${a.s}</b></td><td>${pc(a.s)}</td></tr>
 <tr><td><span class="badge b-amb">ติดบ้าน</span></td><td>5-11</td><td><b>${a.h}</b></td><td>${pc(a.h)}</td></tr>
 <tr><td><span class="badge b-red">ติดเตียง</span></td><td>0-4</td><td><b>${a.b}</b></td><td>${pc(a.b)}</td></tr>
 <tr><td>ยังไม่ประเมิน</td><td>-</td><td><b>${a.n}</b></td><td>${pc(a.n)}</td></tr></table></div></div>
 <div class="card"><h3>3. ภาระงาน CG</h3><div class="tw"><table><tr><th>#</th><th>CG</th><th>ผู้ป่วย</th><th>กลุ่ม 1-2</th><th>กลุ่ม 3-4</th><th>เป้าหมายเยี่ยม/เดือน</th></tr>
 ${db.cgs.map((c,i)=>{const ps=act.filter(p=>p.cgId===c.id),x=ps.filter(p=>p.group==1||p.group==2).length,y=ps.filter(p=>p.group>=3).length;return `<tr><td>${i+1}</td><td>${esc(c.name)}</td><td>${ps.length}</td><td>${x}</td><td>${y}</td><td><b>${x*2+y*4}</b> + เวรศูนย์ 1</td></tr>`}).join('')}</table></div></div>`)}

/* ---------- SETTINGS ---------- */
function rSet(){const S=db.settings;
 M(`<h2>⚙️ ตั้งค่าระบบ</h2><div class="card"><h3>ตั้งค่าหน่วยงานและเงื่อนไข</h3><div class="form">
 <label class="full">ชื่อสถานบริการ / หน่วยงาน<input id="s0" value="${esc(S.orgName||'')}"></label>
 <label>ละติจูดหน่วยบริการ (แสดงบนแผนที่)<div class="gps"><input id="s5" inputmode="decimal" value="${esc(S.orgLat||'')}"><button type="button" class="sm sec" onclick="orgGPS()">📍 ดึงพิกัด</button></div></label>
 <label>ลองจิจูดหน่วยบริการ<input id="s6" inputmode="decimal" value="${esc(S.orgLng||'')}"></label>
 <label>ชม. ต่อการเยี่ยม 1 ครั้ง (ค่าตั้งต้น)<input type="number" id="s1" value="${S.visitHrs}" step="0.5" min="0"></label>
 <label>ชม. เวรประจำศูนย์<input type="number" id="s2" value="${S.dutyHrs}" step="0.5" min="0"></label>
 <label>นับเสาร์-อาทิตย์เป็นวันทำงาน<select id="s3"><option value="0">ไม่นับ</option><option value="1" ${S.weekend?'selected':''}>นับ</option></select></label>
 <label class="full">วันหยุดนักขัตฤกษ์ (บรรทัดละ 1 วัน เช่น 2569-04-13)<textarea id="s4" rows="4">${esc(S.holidays)}</textarea></label></div><br><button onclick="saveSet()">💾 บันทึก</button></div>
 ${gsCard()}<div class="card"><h3>สำรอง/กู้คืนข้อมูล</h3><p class="mut">ข้อมูลเก็บในเบราว์เซอร์ของเครื่องนี้ ควรสำรองเป็นประจำ</p><div class="toolbar">
 <button onclick="dl('smartcg_backup_'+todayISO()+'.json',JSON.stringify(db),'application/json')">⬇️ สำรองข้อมูล (JSON)</button>
 <label class="btnlike">⬆️ กู้คืนจากไฟล์<input type="file" accept=".json" hidden onchange="restore(this)"></label>
 <button class="sec" onclick="csvPat()">⬇️ รายชื่อผู้ป่วย (CSV)</button>
 <button class="del" onclick="resetAll()">ล้างข้อมูลทั้งหมด</button></div></div>
 <div class="card">ผู้ป่วย ${db.patients.length} • CG ${db.cgs.length} • ADL ${db.adl.length} • TAI ${db.tai.length} • เยี่ยมบ้าน ${db.visits.length} รายการ</div>`)}
function saveSet(){Object.assign(db.settings,{orgName:$('#s0').value.trim(),visitHrs:+$('#s1').value||0,dutyHrs:+$('#s2').value||0,weekend:$('#s3').value==='1',holidays:$('#s4').value,orgLat:$('#s5').value.trim(),orgLng:$('#s6').value.trim()});save();alert('บันทึกการตั้งค่าแล้ว')}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.patients||!d.cgs)throw 0;if(!confirm('ข้อมูลปัจจุบันจะถูกแทนที่ ยืนยัน?'))return;db=d;db._h=null;normDb();save();load();alert('กู้คืนสำเร็จ');(async()=>{if(gsReady()&&confirm('ส่งข้อมูลที่กู้คืนขึ้น Google Sheet ด้วยหรือไม่?'))await gsPushAll();go('dash')})()}catch(e){alert('ไฟล์ไม่ถูกต้อง')}};r.readAsText(f)}
function csvPat(){const rows=[['ชื่อ-สกุล','เลขบัตรประชาชน','วันเกิด','อายุ','เพศ','หมู่','ที่อยู่','Latitude','Longitude','เบอร์โทร','โรคประจำตัว','ADL','TAI','กลุ่ม','CG','ญาติ','เบอร์ญาติ','สถานะ']];
 db.patients.forEach(p=>rows.push([p.name,p.cid?"'"+p.cid:'',p.birth?thDate(p.birth):'',age(p.birth),p.sex,p.moo,p.address,p.lat,p.lng,p.phone,p.disease,p.adl,p.tai,p.group,cgName(p.cgId),p.relative,p.relPhone,p.status==='inactive'?'จำหน่าย':'อยู่ในความดูแล']));
 dl(`รายชื่อผู้สูงอายุ_${todayISO()}.csv`,toCSV(rows),'text/csv;charset=utf-8')}
function resetAll(){if(prompt('พิมพ์ RESET เพื่อยืนยันล้างข้อมูลทั้งหมด')!=='RESET')return;localStorage.removeItem(KEY);localStorage.removeItem(GSS);load();alert('รีเซ็ตเรียบร้อย (ล้างเฉพาะเครื่องนี้ ข้อมูลใน Google Sheet ยังอยู่ และจะถูกดึงกลับมาเมื่อซิงค์)');go('dash');syncNow(true)}
</script>
</body>
