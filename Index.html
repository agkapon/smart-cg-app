<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบเยี่ยมบ้านผู้ป่วย LTC</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--p:#0f766e;--p2:#0d9488;--pl:#ccfbf1;--bg:#f5f3f0;--b:#cbd5e1;--t:#1e293b;--m:#64748b;--br:#8b6447}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--t);font-size:15px;-webkit-text-size-adjust:100%;display:flex;flex-direction:column;min-height:100vh}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f766e,#0891b2);padding:16px;width:100%;position:fixed;inset:0;z-index:200}
.lbox{background:#fff;padding:28px 24px;border-radius:16px;width:100%;max-width:380px;box-shadow:0 10px 40px #0003}
.lbox h1{margin:0 0 4px;color:var(--p);font-size:24px}
.lbox label{display:block;margin:12px 0;font-size:14px;color:var(--m);font-weight:600}
.lbox input,.lbox select{width:100%;margin-top:4px}
#app{display:none;flex:1;flex-direction:column}
.side{position:fixed;left:0;top:0;bottom:0;width:245px;background:#0f3d3a;color:#fff;padding:16px 0;overflow-y:auto;z-index:40;transition:transform .25s}
.brand{padding:0 18px 16px;font-weight:700;font-size:19px;border-bottom:1px solid #ffffff22;margin-bottom:8px}
.brand small{display:block;font-weight:300;font-size:11px;opacity:.8;margin-top:2px}
.side a{display:block;padding:12px 18px;color:#d1fae5;cursor:pointer;border-left:4px solid transparent;font-size:14px}
.side a:hover,.side a.act{background:#ffffff1a;color:#fff;border-left-color:#5eead4}
.main{margin-left:245px;padding:20px;flex:1}
.footer{margin-left:245px;text-align:center;padding:16px;font-size:13px;color:var(--m);border-top:1px solid #e2e8f0;background:#fff;margin-top:auto}

.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px #0000000a;border:1px solid #ece7e1}
h2{margin:0 0 14px;color:var(--p);font-size:19px}
h3{margin:0 0 10px;font-size:16px;color:#334155}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
input,select,textarea{font-family:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--b);border-radius:8px;background:#fff;width:100%;color:var(--t)}
textarea{min-height:70px}
button,.btnlike{font-family:inherit;font-size:14px;padding:9px 16px;border:0;border-radius:8px;background:var(--p);color:#fff;cursor:pointer;display:inline-block;font-weight:600;text-align:center}
button:hover{background:var(--p2)}button.sec{background:#e2e8f0;color:var(--t)}button.sec:hover{background:#cbd5e1}button.del{background:#dc2626}button.sm{padding:5px 10px;font-size:13px;width:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #e2e8f0;padding:7px 9px;text-align:left;vertical-align:middle}th{background:#f8fafc;font-weight:600;color:#334155}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-grn{background:#dcfce7;color:#166534}.b-amb{background:#fef3c7;color:#92400e}.b-red{background:#fee2e2;color:#991b1b}.b-blu{background:#dbeafe;color:#1e40af}.b-gry{background:#f1f5f9;color:#475569}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;font-size:13px;color:var(--m);gap:4px;font-weight:600}
.full{grid-column:1/-1}
.gps{display:flex;gap:6px}.gps input{flex:1;min-width:0}.gps button{white-space:nowrap;width:auto}
.q{border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:10px;background:#fafafa}
.q .opts{display:grid;gap:6px;margin-top:8px}.q label{cursor:pointer;font-weight:normal}
.chk-group{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:6px}
.chk-item{display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:13px;font-weight:normal;color:var(--t);background:#f8fafc;padding:8px 10px;border-radius:8px;border:1px solid #e2e8f0}
.chk-item input{margin-top:2px;width:18px;height:18px;accent-color:var(--p);flex-shrink:0}

.time-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tchip{border:1px solid var(--b);background:#fff;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;color:var(--t);transition:.1s}
.tchip.active{background:#fdf4ed;border-color:#b08968;color:#8b6447}

.score{position:sticky;top:0;background:var(--pl);padding:10px 14px;border-radius:10px;font-size:16px;margin-bottom:12px;z-index:2;font-weight:600;color:#042f2e;border:1px solid #5eead4}
.sch td,.sch th{padding:4px;text-align:center;font-size:12px;white-space:nowrap}
.sch td.nm{text-align:left}.sch td.d{cursor:pointer;min-width:24px}
.sch .off{background:#f1f5f9;color:#94a3b8}.sch td.on{background:#fde68a;font-weight:700}.sch td.done{background:#86efac;font-weight:700}.sch td.duty{background:#93c5fd;font-weight:700}
.sch tr.cgh td{background:#ccfbf1;font-weight:700;text-align:left;color:#0f766e}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:300}
#modal .box{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:780px;max-height:90vh;overflow-y:auto}
.mut{color:var(--m)}.err{color:#dc2626;font-size:13px}
.menu-btn{display:none;align-items:center;gap:6px;background:var(--p);color:#fff;border:0;padding:8px 14px;border-radius:8px;font-weight:600;margin-bottom:14px}
.report-header{text-align:center;margin-bottom:20px;display:none}
.thumb{width:42px;height:42px;object-fit:cover;border-radius:6px;border:1px solid #cbd5e1;cursor:pointer}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid #cbd5e1;cursor:pointer}

/* ===== DASHBOARD ===== */
.dhero{position:relative;overflow:hidden;background:linear-gradient(115deg,#4a3324 0%,#7d5a40 45%,#e2bd8f 100%);color:#fff;border-radius:22px;padding:22px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 10px 25px -10px #7d5a40}
.dhero:after{content:"";position:absolute;right:-60px;bottom:-90px;width:260px;height:260px;border-radius:50%;background:#ffffff14}
.dhero .ic{width:64px;height:64px;border-radius:16px;background:#ffffff26;display:grid;place-items:center;font-size:30px;flex-shrink:0;border:1px solid #ffffff33}
.dhero h1{margin:0;font-size:26px;font-weight:700}
.dhero p{margin:2px 0 0;opacity:.9;font-size:14px}
.dhero select{margin-left:auto;width:auto;min-width:210px;border-radius:12px;padding:11px 14px;border:0;position:relative;z-index:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:18px 0}
.kpi{background:#fff;border-radius:18px;padding:18px;display:flex;gap:14px;align-items:center;box-shadow:0 2px 10px #0000000d;border-top:5px solid var(--c)}
.kpi .ki{width:58px;height:58px;border-radius:16px;background:var(--g);display:grid;place-items:center;font-size:26px;flex-shrink:0;box-shadow:0 8px 16px -6px var(--c)}
.kpi b{font-size:30px;display:block;line-height:1.1;color:#0f172a}
.kpi span{display:block;color:#475569;font-weight:600;font-size:14px}
.kpi small{color:#64748b;font-size:12px}
.cgcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;margin-bottom:18px}
.cgc{background:#fff;border-radius:18px;padding:16px 18px;border-top:5px solid #b08968;box-shadow:0 2px 10px #0000000d}
.cgc .hd{display:flex;gap:12px;align-items:center}
.cgc .hd b{font-size:16px;display:block}
.cgc .hd small{color:#64748b;font-size:13px}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;flex-shrink:0}
.bar{height:9px;background:#f1f5f9;border-radius:9px;margin:14px 0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#8b6447,#d4a373)}
.cst{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:4px}
.cst b{font-size:21px;display:block;color:#0f172a}.cst b.red{color:#e11d48}
.cst small{color:#64748b;font-size:12px}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.obtn{background:#fff!important;border:1px solid #e2e8f0;color:#334155!important;border-radius:10px;padding:7px 12px;font-size:13px;width:auto!important}
.obtn:hover{background:#faf6f1!important;border-color:#d6c3ae}
.heat{background:#fff;border-radius:18px;border-top:5px solid #b08968;box-shadow:0 2px 10px #0000000d;overflow:hidden;margin-bottom:18px}
.heat .hh{display:flex;gap:12px;align-items:center;padding:16px 18px}
.heat .hh .ic2{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#d4a373,#8b6447);display:grid;place-items:center;font-size:20px}
.heat table{font-size:14px}.heat th{background:#faf6f1;border:0;border-bottom:1px solid #ece7e1;text-align:center;white-space:nowrap;padding:10px 8px}
.heat td{border:0;border-bottom:1px solid #f1ede8;text-align:center;padding:9px 8px;white-space:nowrap}
.heat td:first-child,.heat th:first-child{text-align:left;padding-left:18px;position:sticky;left:0;background:#fff;z-index:1}
.heat th:first-child{background:#faf6f1}
.hc{display:inline-block;min-width:40px;padding:5px 8px;border-radius:8px;font-weight:600;color:#3f2a1c}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#faf6f1;border:1px solid #ece7e1;border-radius:12px;padding:8px 14px;font-size:13px}
.chip b{font-size:18px;margin-left:4px;color:#5c4030}

/* ===== LOGIN ===== */
#login{background:linear-gradient(145deg,#3b2a1f 0%,#7d5a40 55%,#d9b48a 100%);overflow-y:auto;align-items:flex-start}
.lwrap{width:100%;max-width:400px;margin:auto;display:flex;flex-direction:column;align-items:center;gap:18px;padding:12px 0}
.lbrand{text-align:center;color:#fff}
.llogo{width:76px;height:76px;margin:0 auto 12px;border-radius:22px;background:#ffffff26;border:1px solid #ffffff40;display:grid;place-items:center;font-size:38px;box-shadow:0 10px 30px #0004}
.lbrand h1{margin:0;font-size:26px;font-weight:700;color:#fff}.lbrand p{margin:6px 0 0;font-size:13px;opacity:.85}
.lbox{max-width:400px;border-radius:20px;padding:24px}
.lorg{background:#faf6f1;border:1px solid #ece7e1;border-radius:12px;padding:10px 12px;margin-bottom:6px;text-align:center;font-size:14px;color:#5c4030}.lorg b{display:block;font-size:15px}.lorg small{color:#8b6447}
.lbox button{background:#8b6447}.lbox button:hover{background:#74513a}
.lbox input:focus,.lbox select:focus{outline:2px solid #d4a373;border-color:#d4a373}
.lconn{font-size:12px;border-radius:10px;padding:8px 10px;margin:6px 0;line-height:1.5}.lconn.warn{background:#fef3c7;color:#92400e}.lconn.ok{background:#dcfce7;color:#166534}
.lbox button.lconnb{width:100%;margin-top:10px;background:#fff;color:#8b6447;border:1.5px solid #8b6447}.lbox button.lconnb:hover{background:#faf6f1}
.lfoot{text-align:center;color:#fff;font-size:13px;line-height:1.7;padding:4px 10px;text-shadow:0 1px 3px #0004}
.lfoot:before{content:"";display:block;width:60px;height:2px;background:#ffffff77;border-radius:2px;margin:0 auto 12px}
/* ===== CG DASHBOARD / SCREENING ===== */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pcard{background:#fff;border-radius:20px;border:1px solid #e5e7eb;border-top:4px solid var(--c);overflow:hidden;box-shadow:0 2px 10px #0000000d}
.pch{padding:16px;display:flex;gap:12px;align-items:center;background:var(--bg)}
.pch b{font-size:17px;display:block}.pch small{display:block;color:#475569;margin-top:2px}
.pav{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--c),var(--c2));display:grid;place-items:center;font-size:26px;flex-shrink:0;color:#fff}
.pcb{padding:14px 16px 16px;display:grid;gap:10px}
.pbtn{display:block;width:100%;border-radius:12px;padding:12px;color:#fff;font-weight:700;text-align:center;background:var(--c);font-size:15px}
.pbtn span{display:block;font-weight:600;font-size:13px;margin-top:3px;opacity:.95}
.pbtn.pb-no{background:#fff1f2;color:#9f1239;border:1.5px solid #fda4af}.pbtn.pb-no span{color:#e11d48}.pbtn.pb-no:hover{background:#ffe4e6}
.pbtn.pb-ok{background:#f0fdf4;color:#166534;border:1.5px solid #86efac}.pbtn.pb-ok span{color:#15803d}.pbtn.pb-ok:hover{background:#dcfce7}
.pchip{background:#fef3c7;color:#92400e;border-radius:12px;padding:8px 12px;font-weight:600;font-size:14px}.pchip.ok{background:#dcfce7;color:#166534}
.scrg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.scrc{border:1px solid #e5e7eb;border-radius:16px;padding:14px;background:linear-gradient(135deg,var(--bg),#fff)}
.scrc .sh{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-weight:700;color:var(--c)}
.sic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:17px;background:linear-gradient(135deg,var(--c),var(--c2));flex-shrink:0}
.scrc select{background:#fff;border-radius:10px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid #ece7e1}
.dsec{background:#faf8f5;border:1px solid #e7e0db;border-radius:12px;padding:12px 14px}.dsec>summary{cursor:pointer;font-weight:700;color:var(--br);font-size:16px}
.lconn-link{text-align:center;font-size:12px;margin-top:10px}.lconn-link a{color:#8b6447}
@media(max-width:700px){.scrg{grid-template-columns:1fr}.kpis[style]{grid-template-columns:repeat(3,1fr)!important}}
@media print{body.pm>*:not(#modal){display:none!important}body.pm #modal{position:static;background:none;display:block!important;padding:0}body.pm #modal .box{max-height:none;box-shadow:none;max-width:none}}
/* ===== MAP PICKER ===== */
#pick{position:fixed;inset:0;z-index:500;background:#000a;display:flex;align-items:center;justify-content:center;padding:10px}
.pk-box{background:#fff;border-radius:16px;width:100%;max-width:920px;height:min(88vh,740px);display:flex;flex-direction:column;overflow:hidden}
.pk-h{display:flex;gap:8px;align-items:center;padding:10px 12px;flex-wrap:wrap;border-bottom:1px solid #ece7e1}
.pk-s{display:flex;gap:6px;flex:1;min-width:210px}.pk-s input{flex:1;min-width:0}
#pkmap{flex:1;min-height:220px}
.pk-f{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-top:1px solid #ece7e1;font-size:13px}
.pk-f button{white-space:nowrap}.pk-f button:disabled{opacity:.45;cursor:not-allowed}
#pkres{max-height:150px;overflow:auto;padding:0 12px}
#pkres button{display:block;width:100%;text-align:left;background:#faf6f1;color:#3b2a1f;margin:4px 0;font-weight:400;font-size:13px}
.gpsbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.gpsbar .mut{font-size:13px;margin-right:2px}.gpsbar button{width:auto;white-space:nowrap}
/* ===== DIALOG ===== */
#dlg{position:fixed;inset:0;z-index:900;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg-box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:420px;box-shadow:0 20px 50px #0006}
.dlg-m{font-size:15px;line-height:1.6;white-space:normal;word-break:break-word;margin-bottom:14px}
.dlg-box input{margin-bottom:14px}
.dlg-b{display:flex;gap:10px;justify-content:flex-end}.dlg-b button{min-width:84px}
/* ===== MAP / HISTORY / DETAIL ===== */
.mtabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#f1ece6;border-radius:14px;padding:6px;margin:16px 0}
.mtab{background:transparent;color:#5c4030;border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;width:auto}
.mtab:hover{background:#ffffff80}.mtab.act{background:#fff;box-shadow:0 1px 6px #0002}
.mtab .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.morg{margin-left:auto;color:#8b6447;font-size:13px;padding:0 10px}
.mapgrid{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start}
.mapcard{background:#fff;border-radius:18px;padding:10px;box-shadow:0 2px 10px #0000000d}
#leafletMap{width:100%;height:560px;border-radius:12px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.legend span{padding:5px 12px;border-radius:20px;font-size:13px;font-weight:600;border:1px solid}
.plist{background:#fff;border-radius:18px;border-top:5px solid #6366f1;box-shadow:0 2px 10px #0000000d;overflow:hidden}
.ph0{display:flex;gap:12px;align-items:center;padding:16px 18px;border-bottom:1px solid #f1ede8}.ph0 .ic2{width:42px;height:42px;border-radius:12px;background:#4f6df5;color:#fff;display:grid;place-items:center;font-size:18px}.ph0 small{display:block;color:#64748b;font-size:12px}
.pbody{max-height:600px;overflow-y:auto;padding:10px}
.pi{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid #ece7e1;border-radius:14px;margin-bottom:8px;cursor:pointer}.pi:hover{background:#faf6f1}
.pic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.pi.miss{border-color:#fecaca}.pi.miss .pic{box-shadow:0 0 0 3px #fff,0 0 0 5px #e11d48}
.pi small{display:block;color:#64748b;font-size:13px}.red{color:#e11d48;font-weight:600}
.pin{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px #0006;display:grid;place-items:center;font-size:17px}
.pin.miss{box-shadow:0 0 0 3px #e11d48,0 2px 6px #0006}
.hctl{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}.hctl select{margin-left:0!important}
.hbtn{background:#fff!important;color:#5c4030!important;border-radius:12px;padding:11px 16px;width:auto!important}
.vcard{display:flex;gap:16px;background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d;cursor:pointer;position:relative}
.vcard:hover{box-shadow:0 4px 16px #0000001f}
.vdt{width:62px;border-radius:14px;background:#faf6f1;text-align:center;padding:8px 4px;flex-shrink:0;align-self:flex-start}.vdt b{display:block;font-size:24px;line-height:1.1}.vdt small{font-size:12px;color:#64748b}
.vmain{padding-right:60px}.vmain b{font-size:16px}.vmain .sub{color:#64748b;font-size:14px;margin:3px 0 8px}
.vbadges{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;gap:4px;align-items:center;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;border:1px solid}
.vic{position:absolute;right:16px;top:14px;display:flex;gap:8px;font-size:16px}.vic span{opacity:.25}.vic span.on{opacity:1}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.dcard{background:#fff;border-radius:18px;box-shadow:0 2px 10px #0000000d;overflow:hidden;margin-bottom:18px;border-top:5px solid var(--c,#10b981)}
.dcard .dh{display:flex;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid #f1ede8}
.dcard .dh .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:18px;background:var(--c)}.dcard .dh b{font-size:18px}
.dcard .dbd{padding:16px 20px}
.chkl{list-style:none;margin:0;padding:0}.chkl li{padding:9px 0;border-bottom:1px dashed #e7e0db}.chkl li:before{content:'✓';color:#16a34a;font-weight:700;margin-right:10px}.chkl li:last-child{border:0}
.vts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.vt{background:#faf6f1;border:1px solid #ece7e1;border-radius:12px;padding:12px 14px}.vt small{color:#64748b;display:block;font-size:13px}.vt b{font-size:24px}.vt span{font-size:12px;color:#64748b;margin-left:4px}

function normDb(){db.settings=Object.assign({orgName:'โรงพยาบาลส่งเสริมสุขภาพตำบล',orgSub:'',defAddr:'',visitHrs:2,dutyHrs:8,weekend:false,holidays:''},db.settings||{});COLS.forEach(k=>db[k]=db[k]||[]);db.schedules=db.schedules||{};db.del=db.del||{};db._d=db._d||{}}

/* ติดตามรายการที่ถูกเพิ่ม/แก้/ลบ เพื่อส่งขึ้น Google Sheet */
function hsh(o){const s=JSON.stringify(o,(k,v)=>k==='_u'||k==='photos'||k==='nLocal'?undefined:v);let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h+':'+s.length}
function recMap(d,c){if(c==='schedules')return d.schedules||{};if(c==='settings')return d.settings?{settings:d.settings}:{};const m={};(d[c]||[]).forEach(r=>m[r.id]=r);return m}
function stamp(force){if(!stampNeeded&&!force&&db._h)return;stampNeeded=false;const t=Date.now(),first=!db._h;db._h=db._h||{};db.del=db.del||{};db._d=db._d||{};
 ALLC.forEach(c=>{const m=recMap(db,c),H=db._h[c]=db._h[c]||{};
  for(const id in m){const r=m[id];if(!r||typeof r!=='object')continue;const h=hsh(r);if(H[id]!==h){if(!first){r._u=t;delete db.del[c+':'+id];db._d[c+':'+id]=t}H[id]=h}}
  for(const id in H)if(!(id in m)){if(!first&&c!=='settings'){db.del[c+':'+id]=t;db._d[c+':'+id]=t}delete H[id]}})}
function markAllDirty(){stamp(true);const t=Date.now();ALLC.forEach(c=>{const m=recMap(db,c);for(const id in m){const r=m[id];if(r&&typeof r==='object'){r._u=r._u||t;db._d[c+':'+id]=r._u}}});persist()}

function localRec(c,id){return c==='settings'?db.settings:c==='schedules'?db.schedules[id]:(db[c]||[]).find(r=>r.id===id)}
function setRec(c,id,d){if(c==='settings')db.settings=d;else if(c==='schedules')db.schedules[id]=d;else{const a=db[c]=db[c]||[],i=a.findIndex(r=>r.id===id);i>=0?a[i]=d:a.push(d)}}
function removeRec(c,id){if(c==='schedules')delete db.schedules[id];else if(c!=='settings')db[c]=(db[c]||[]).filter(r=>r.id!==id)}
function applyRows(rows){let n=0,sets=false;const H=c=>(db._h[c]=db._h[c]||{});
 rows.forEach(r=>{const c=r.c,id=r.id,key=c+':'+id;if(!ALLC.includes(c))return;
  const cur=localRec(c,id),cu=cur?(cur._u||0):0;
  if(r.del){if(cur&&r._u>=cu){removeRec(c,id);delete H(c)[id];delete db._d[key];db.del[key]=r._u;n++}else if(!cur)db.del[key]=Math.max(db.del[key]||0,r._u);return}
  if(cur&&!(r._u>cu))return;
  const d=r.data;d._u=r._u;if(c==='visits'&&cur){if(cur.photos&&cur.photos.length)d.photos=cur.photos;if(cur.nLocal)d.nLocal=cur.nLocal}
  setRec(c,id,d);H(c)[id]=hsh(d);delete db._d[key];delete db.del[key];n++;if(c==='settings')sets=true});
 if(n){normDb();if(sets)H('settings').settings=hsh(db.settings)}
 return n}
function enrich(c,d,r){
 if(c==='patients')d.cgName=cgName(r.cgId);
 if(c==='visits'){d.pName=(P(r.pid)||{}).name||'';d.cgName=cgName(r.cgId);d.nPhotos=Math.max((r.photos||(r.photo?[r.photo]:[])).length,r.nLocal||0,(r.photoIds||[]).length,+r.nPhotos||0)}
 if(c==='adl'||c==='tai'||c==='scr')d.pName=(P(r.pid)||{}).name||'';
 if(c==='schedules')d.month=r.id||''}
function buildDirty(){const out=[],keys=[];
 for(const key in db._d){const i=key.indexOf(':'),c=key.slice(0,i),id=key.slice(i+1),r=recMap(db,c)[id],tomb=db.del[key];
  if(r){const d=JSON.parse(JSON.stringify(r,(k,v)=>k==='photos'||k==='photo'||k==='nLocal'?undefined:v));if(c==='schedules')d.month=id;enrich(c,d,r);if(c==='schedules')d.month=id;out.push({c,id,_u:r._u||Date.now(),data:d});keys.push([key,db._d[key]])}
  else if(tomb){out.push({c,id,_u:tomb,del:1});keys.push([key,db._d[key]])}
  else delete db._d[key]}
 return{out,keys}}

const useRun=()=>GS_EMB&&window.google&&google.script&&google.script.run;
function runApi(p){return new Promise((res,rej)=>{const t=setTimeout(()=>rej(Object.assign(new Error('timeout'),{name:'AbortError'})),45000);
 google.script.run.withSuccessHandler(r=>{clearTimeout(t);res(r)}).withFailureHandler(e=>{clearTimeout(t);rej(Object.assign(new Error((e&&e.message)||String(e)),{name:'TypeError'}))}).apiCall(p)})}
async function gsCall(body,cfgo){const c=cfgo||gsCfg(),payload=JSON.stringify(Object.assign({key:c.key},body));let j;
 if(useRun()){let t;try{t=await runApi(payload);j=JSON.parse(t)}catch(e){if(e&&e.name==='SyntaxError')throw new Error('ตอบกลับไม่ถูกต้อง');throw e}}
 else{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),40000);
  try{const r=await fetch(c.url,{method:'POST',body:payload,signal:ac.signal});
   if(!r.ok)throw new Error('เซิร์ฟเวอร์ตอบกลับผิดพลาด ('+r.status+')');
   try{j=await r.json()}catch(e){throw new Error('ตอบกลับไม่ถูกต้อง ตรวจว่า URL เป็นของ Web App (ลงท้าย /exec) และตั้งสิทธิ์เป็น "Anyone"')}}finally{clearTimeout(tm)}}
 if(!j.ok)throw new Error(j.err||'เกิดข้อผิดพลาด');return j}

async function uploadPhotos(){let n=0;for(const v of db.visits){const nl=Math.max((v.photos||(v.photo?[v.photo]:[])).length,v.nLocal||0);if(!nl)continue;const ids=v.photoIds||[];if(ids.length>=nl)continue;
  for(let i=ids.length;i<nl;i++){const src=await vLocal(v,i);if(!src)break;const r=await gsCall({action:'upphoto',vid:v.id,idx:i,data:src});ids[i]=r.id;v.photoIds=ids;stampNeeded=true;n++;persist()}}return n}
function keyRevoked(){const c=gsCfg();if(!c)return;const st=gsState();
 if(st.role==='cg'){localStorage.setItem(GSU,c.url);localStorage.removeItem(GSK);if(typeof currentUser!=='undefined'&&currentUser&&currentUser.role==='cg'&&$('#app')&&$('#app').style.display!=='none'){dlg({msg:'รหัสเข้าใช้ (Key) ของคุณถูกเปลี่ยนหรือถูกยกเลิก\nกรุณาเข้าสู่ระบบใหม่ด้วยรหัสใหม่จากผู้ดูแลระบบ'}).then(()=>logout())}}
 else setStatus('⚠️ รหัส (Key) ไม่ถูกต้อง กรุณาตรวจสอบ ADMIN_KEY ในการตั้งค่าเชื่อมต่อ','#dc2626')}
async function syncNow(manual){
 if(!gsCfg()||!db)return '';
 if(gsBusy){gsAgain=true;return ''}
 gsBusy=true;setStatus('⏳ กำลังซิงค์...');let err='',applied=false,rej=0;
 try{
  const st=gsState(),pr=await gsCall({action:'pull',since:st.cursor||0});
  stamp();if(applyRows(pr.rows||[])){applied=true;persist()}
  st.cursor=pr.t;st.role=pr.role;st.cgId=pr.cgId;localStorage.setItem(GSS,JSON.stringify(st));
  let perr='';try{await uploadPhotos()}catch(e){perr=gsErr(e)}
  for(let g=0;g<50;g++){stamp();const {out,keys}=buildDirty();if(!out.length)break;
   const bo=out.slice(0,60),bk=keys.slice(0,60),r=await gsCall({action:'push',recs:bo});
   bk.forEach(([k,v])=>{if(db._d[k]===v)delete db._d[k]});persist();rej+=(r.rejected||[]).length}
  if(!rej&&perr)err='ส่งข้อมูลแล้ว แต่อัปโหลดรูปไม่สำเร็จ: '+perr;
  if(rej)err='มี '+rej+' รายการที่เซิร์ฟเวอร์ไม่รับ (ไม่มีสิทธิ์หรือข้อมูลใหญ่เกินไป)'
 }catch(e){err=gsErr(e)}
 gsBusy=false;
 if(/รหัส \(Key\) ไม่ถูกต้อง/.test(err))keyRevoked();
 err?setStatus('⚠️ '+err,'#dc2626'):setStatus('☁️ ซิงค์แล้ว '+hm(),'#059669');
 gsFails=err?gsFails+1:0;
 if(applied){const lg=$('#login');if(lg&&lg.style.display!=='none')fillCgLogin();if(!refreshView())toast('🔄 มีข้อมูลใหม่จากเครื่องอื่น แตะเพื่อรีเฟรช',()=>{if(PAGES[curPage])go(curPage)})}
 if(gsAgain){gsAgain=false;setTimeout(()=>syncNow(),300)}
 return err}

 const url=GS_EMB?GS_EMBED:$('#gsU').value.trim(),key=$('#gsK').value.trim(),er=$('#gserr');
 if(!GS_EMB&&!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url))return er.textContent='URL ไม่ถูกต้อง ต้องขึ้นต้น https://script.google.com/ และลงท้าย /exec';

 er.style.color='#64748b';er.textContent='⏳ กำลังทดสอบการเชื่อมต่อ...';
 const old={k:localStorage.getItem(GSK),s:localStorage.getItem(GSS)},onLogin=$('#login').style.display!=='none';
 try{localStorage.setItem(GSK,JSON.stringify({url,key}));localStorage.setItem(GSU,url);localStorage.removeItem(GSS);

  localStorage.setItem(GSS,JSON.stringify({cursor:0,role:w.role,cgId:w.cgId}));

 }catch(e){er.style.color='#dc2626';er.textContent='เชื่อมต่อไม่สำเร็จ: '+gsErr(e);
  old.k===null?localStorage.removeItem(GSK):localStorage.setItem(GSK,old.k);old.s===null?localStorage.removeItem(GSS):localStorage.setItem(GSS,old.s)}}

function sha256(str){const u=new TextEncoder().encode(str),l=u.length,n=((l+9+63)>>6)<<6,w=new Uint8Array(n);w.set(u);w[l]=0x80;const dv=new DataView(w.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));
 const pr=[];for(let c=2;pr.length<64;c++){let ok=true;for(let d=2;d*d<=c;d++)if(c%d===0){ok=false;break}if(ok)pr.push(c)}
 const fr=x=>Math.floor((x-Math.floor(x))*4294967296),K=pr.map(p=>fr(Math.cbrt(p)));let H=pr.slice(0,8).map(p=>fr(Math.sqrt(p)));
 for(let i=0;i<n;i+=64){const W=new Array(64);for(let t=0;t<16;t++)W[t]=dv.getUint32(i+t*4);
  for(let t=16;t<64;t++){const a=W[t-15],c=W[t-2];W[t]=(W[t-16]+(((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3))+W[t-7]+(((c>>>17)|(c<<15))^((c>>>19)|(c<<13))^(c>>>10)))|0}
  let [a,b,c,d,e,f,g,h]=H;
  for(let t=0;t<64;t++){const T1=(h+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+K[t]+W[t])|0,T2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&b)^(a&c)^(b&c)))|0;h=g;g=f;f=e;e=(d+T1)|0;d=c;c=b;b=a;a=(T1+T2)|0}
  H=[H[0]+a|0,H[1]+b|0,H[2]+c|0,H[3]+d|0,H[4]+e|0,H[5]+f|0,H[6]+g|0,H[7]+h|0]}
 return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}

async function cgKeyLogin(url,key,c){
 const cfg=gsCfg(),st=gsState();
 if(cfg&&cfg.key===key&&st.cgId===c.id)return {ok:true};
 try{const w=await gsCall({action:'whoami'},{url,key});
  if(w.role!=='cg'||w.cgId!==c.id)return {err:'รหัสนี้ไม่ใช่ของ '+c.name};
  localStorage.setItem(GSK,JSON.stringify({url,key}));localStorage.setItem(GSU,url);
  if(!localStorage.getItem(GSS))localStorage.setItem(GSS,JSON.stringify({cursor:0,role:'cg',cgId:c.id}));
  return {ok:true}
 }catch(e){const m=gsErr(e);return {err:/รหัส \(Key\)/.test(m)?'รหัสผ่านไม่ถูกต้อง (ใช้รหัสเข้าใช้ Key ที่ผู้ดูแลระบบตั้งไว้ใน Google Sheet)':'ตรวจรหัสไม่ได้ '+m}}}

 const due=ds.filter(d=>d<=cut).length,done=db.visits.filter(v=>v.pid===p.id&&v.date.startsWith(key)).length;return Math.max(0,due-done)}

async function getPos(){

 catch(e){if(e&&e.code===1)throw e;return await one({enableHighAccuracy:false,timeout:20000,maximumAge:120000})}}

 t.innerHTML=`⚠️ ${esc(gpsWhy(c))} · <a href="#" onclick="gpsHelp(${c});return false">ดูวิธีแก้</a> · <a href="#" onclick="pickVGps();return false">ปักหมุดบนแผนที่</a> · <a href="#" onclick="pasteVGps();return false">วางพิกัดเอง</a>${home?` · <a href="#" onclick="useHomeGps();return false">ใช้พิกัดบ้านผู้สูงอายุแทน</a>`:''}`}
/* ---------- ปักหมุดบนแผนที่ (ใช้ได้ทั้งมือถือและคอมพิวเตอร์ ไม่ต้องใช้ GPS) ---------- */
var _pk=null;
function closePick(){if(_pk&&_pk.map){try{_pk.map.remove()}catch(e){}}_pk=null;const o=document.getElementById('pick');if(o)o.remove()}
function pickOnMap(latId,lngId,after){
 if(typeof L==='undefined')return alert('โหลดแผนที่ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต แล้วรีเฟรชหน้าเว็บ');
 closePick();const S=db.settings||{};
 const ov=document.createElement('div');ov.id='pick';
 ov.innerHTML=`<div class="pk-box"><div class="pk-h"><b>📌 ปักหมุดบนแผนที่</b><div class="pk-s"><input id="pkq" placeholder="ค้นหาชื่อสถานที่/หมู่บ้าน เช่น รพ.สต.บ้านห้วยอาลัย"><button type="button" id="pkgo">ค้นหา</button></div><button type="button" class="sec" id="pkgps">📍 ตำแหน่งของฉัน</button><button type="button" class="sec" id="pkx">✕ ปิด</button></div><div id="pkres"></div><div id="pkmap"></div><div class="pk-f"><span id="pkt" class="mut">แตะ/คลิกบนแผนที่เพื่อปักหมุด หรือลากหมุดไปยังตำแหน่งที่ต้องการ (สลับเป็นภาพดาวเทียมได้ที่มุมขวาบนของแผนที่)</span><button type="button" id="pkok" disabled>✅ ใช้ตำแหน่งนี้</button></div></div>`;
 document.body.appendChild(ov);
 const g=id=>document.getElementById(id),cur=[parseFloat(($('#'+latId)||{}).value),parseFloat(($('#'+lngId)||{}).value)],hasCur=!isNaN(cur[0])&&!isNaN(cur[1]),org=[parseFloat(S.orgLat),parseFloat(S.orgLng)],hasOrg=!isNaN(org[0])&&!isNaN(org[1]);
 const map=L.map('pkmap'),osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}),sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'});
 osm.addTo(map);if(L.control&&L.control.layers)L.control.layers({'แผนที่':osm,'ดาวเทียม':sat}).addTo(map);
 _pk={map,pt:null,mk:null};
 const setPt=(ll,zoom)=>{ll={lat:+ll.lat,lng:+ll.lng};_pk.pt=ll;if(_pk.mk)_pk.mk.setLatLng([ll.lat,ll.lng]);else{_pk.mk=L.marker([ll.lat,ll.lng],{draggable:true}).addTo(map);_pk.mk.on('dragend',()=>{const p=_pk.mk.getLatLng();setPt(p)})}
  g('pkt').innerHTML=`📍 <b>${ll.lat.toFixed(6)}, ${ll.lng.toFixed(6)}</b>`;g('pkok').disabled=false;if(zoom)map.setView([ll.lat,ll.lng],zoom)};
 _pk.setPt=setPt;
 if(hasCur){map.setView(cur,17);setPt({lat:cur[0],lng:cur[1]})}else if(hasOrg)map.setView(org,15);else{map.setView([13.75,100.5],6);
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),4000);fetch('https://ipwho.is/',{signal:ac.signal}).then(r=>r.json()).then(j=>{if(j&&j.latitude&&!_pk.pt)map.setView([j.latitude,j.longitude],11)}).catch(()=>{}).finally(()=>clearTimeout(tm))}
 map.on('click',e=>setPt(e.latlng));
 setTimeout(()=>{try{map.invalidateSize()}catch(e){}},80);
 const search=async()=>{const q=g('pkq').value.trim();if(!q)return;const r=g('pkres');r.innerHTML='<p class="mut" style="margin:6px 0">⏳ กำลังค้นหา...</p>';
  try{const j=await (await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=th&countrycodes=th&q='+encodeURIComponent(q))).json();
   r.innerHTML=j.length?j.map((x,i)=>`<button type="button" data-i="${i}">${esc(x.display_name.slice(0,120))}</button>`).join(''):'<p class="mut" style="margin:6px 0">ไม่พบสถานที่นี้ ลองพิมพ์ชื่ออื่น หรือเลื่อนแผนที่แล้วปักหมุดเอง</p>';
   r.querySelectorAll('button').forEach(b=>b.onclick=()=>{const x=j[+b.dataset.i];setPt({lat:+x.lat,lng:+x.lon},17);r.innerHTML=''})}
  catch(e){r.innerHTML='<p class="mut" style="margin:6px 0">ค้นหาไม่สำเร็จ (ตรวจอินเทอร์เน็ต) เลื่อนแผนที่แล้วปักหมุดเองได้</p>'}};
 g('pkgo').onclick=search;g('pkq').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();search()}};
 if(GS_EMB)g('pkgps').style.display='none';
 g('pkgps').onclick=async()=>{try{const p=await getPos();setPt({lat:p.coords.latitude,lng:p.coords.longitude},17)}catch(e){toast('ใช้ตำแหน่งปัจจุบันไม่ได้ ปักหมุดบนแผนที่ได้เลย')}};
 g('pkx').onclick=closePick;
 g('pkok').onclick=()=>{const p=_pk.pt;if(!p)return;const ll=[p.lat.toFixed(6),p.lng.toFixed(6)];$('#'+latId).value=ll[0];$('#'+lngId).value=ll[1];closePick();if(after)after(ll);else toast('✅ ใส่พิกัดแล้ว')}}
function pickVGps(){pickOnMap('vLat','vLng',ll=>{$('#vAcc').value='';$('#vGpsTxt').textContent='📍 '+ll[0]+', '+ll[1]+' (ปักหมุดเอง)'})}
function useHomeGps(){const p=P($('#vp').value);if(!p||!p.lat||!p.lng)return alert('ผู้สูงอายุรายนี้ยังไม่มีพิกัดบ้าน');$('#vLat').value=p.lat;$('#vLng').value=p.lng;$('#vAcc').value='';$('#vGpsTxt').textContent='📍 ใช้พิกัดบ้านผู้สูงอายุ '+p.lat+', '+p.lng}
async function getVGps(auto){const t=$('#vGpsTxt');if(!t)return;
 if(auto){let st='';try{st=(await navigator.permissions.query({name:'geolocation'})).state}catch(e){}if(st==='denied'){showGpsErr(1);return}if(st!=='granted'){t.innerHTML='📍 ยังไม่ได้บันทึกตำแหน่ง · กดปุ่ม "ดึงพิกัดใหม่" หรือ "ปักหมุดบนแผนที่" ด้านล่าง (ข้ามได้)';return}}
 t.textContent='⏳ กำลังดึงพิกัด...';
 try{const pos=await getPos();if(!$('#vLat'))return;$('#vLat').value=pos.coords.latitude.toFixed(6);$('#vLng').value=pos.coords.longitude.toFixed(6);$('#vAcc').value=Math.round(pos.coords.accuracy);
  if($('#vGpsTxt'))$('#vGpsTxt').textContent=`📍 ${$('#vLat').value}, ${$('#vLng').value} (ความแม่นยำประมาณ ${$('#vAcc').value} เมตร)`}
 catch(e){showGpsErr(e&&e.code!==undefined?e.code:2)}}
async function getGPS(){try{const p=await getPos();$('#pLat').value=p.coords.latitude.toFixed(6);$('#pLng').value=p.coords.longitude.toFixed(6);toast('✅ ดึงพิกัดสำเร็จ')}catch(e){alert(gpsHelpText(e&&e.code!==undefined?e.code:2))}}
async function orgGPS(){try{const p=await getPos();$('#s5').value=p.coords.latitude.toFixed(6);$('#s6').value=p.coords.longitude.toFixed(6);toast('✅ ดึงพิกัดสำเร็จ')}catch(e){gpsHelp(e&&e.code!==undefined?e.code:2,['s5','s6'])}}

/* ---------- PATIENTS ---------- */
function rPat(){const q=state.q.toLowerCase(),base=currentUser.role==='cg'?db.patients.filter(p=>p.cgId===currentUser.cgId):db.patients;
 const list=base.filter(p=>(!state.cg||p.cgId===state.cg)&&(state.gf===''||String(p.group)===state.gf)&&(!q||[p.name,p.cid,p.phone,p.disease,p.moo,p.address].join(' ').toLowerCase().includes(q))).sort((a,b)=>cgName(a.cgId).localeCompare(cgName(b.cgId),'th')||(+a.moo-+b.moo));
 M(`<h2>ฐานข้อมูลผู้สูงอายุ / ผู้ป่วยพึ่งพิง</h2><div class="card"><div class="toolbar">
 <button onclick="editPat()">➕ เพิ่มผู้ป่วย</button>
 <input id="pq" placeholder="🔍 ค้นหา ชื่อ / เลขบัตร / โรค" value="${esc(state.q)}" oninput="state.q=this.value;rPatKeep()" style="flex:1;min-width:180px;width:auto">
 ${currentUser.role==='admin'?`<select style="width:auto" onchange="state.cg=this.value;rPat()">${cgOpts(state.cg,'CG ทั้งหมด')}</select>`:''}
 <select style="width:auto" onchange="state.gf=this.value;rPat()"><option value="">ทุกกลุ่ม</option>${[0,1,2,3,4].map(i=>`<option value="${i}" ${state.gf===String(i)?'selected':''}>${GROUPS[i]}</option>`).join('')}</select>
 <span class="mut" style="margin-left:auto">พบ ${list.length} ราย</span></div>
 <div class="tw"><table><tr><th>#</th><th>ชื่อ-สกุล</th><th>วันเกิด</th><th>อายุ</th><th>ที่อยู่ / พิกัด</th><th>โทร</th><th>โรคประจำตัว</th><th>ADL</th><th>กลุ่ม</th><th>CG</th><th class="noprint">จัดการ</th></tr>
 ${list.map((p,i)=>{const [c,cl]=adlCat(p.adl);return `<tr style="${p.status==='inactive'?'opacity:.5':''}"><td>${i+1}</td><td><b>${esc(p.name)}</b>${p.status==='inactive'?' <span class="badge b-gry">จำหน่าย</span>':''}</td><td style="white-space:nowrap">${p.birth?thDate(p.birth):'-'}</td><td>${age(p.birth)}</td><td>ม.${esc(p.moo)} ${p.lat&&p.lng?`<br><a href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank" class="badge b-blu" style="text-decoration:none">📍 นำทาง</a>`:''}</td><td>${esc(p.phone||'-')}</td><td>${esc(p.disease||'-')}</td><td style="white-space:nowrap">${p.adl??''} <span class="badge ${cl}">${c}</span></td><td><b>${p.group}</b></td><td>${esc(cgName(p.cgId))}</td><td style="white-space:nowrap" class="noprint"><button class="sm" onclick="editPat('${p.id}')">แก้</button> <button class="sm sec" onclick="openAdlModal('${p.id}')">ADL</button> <button class="sm sec" onclick="openScrModal('${p.id}')">10 ด้าน</button> ${currentUser.role==='admin'?` <button class="sm del" onclick="delPat('${p.id}')">ลบ</button>`:''}</td></tr>`}).join('')}</table></div></div>`)}
function rPatKeep(){rPat();const e=$('#pq');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}
function editPat(id){const isCG=currentUser.role==='cg';const p=id?P(id):{name:'',cid:'',birth:'',sex:'',moo:'',address:(db.settings.defAddr||''),lat:'',lng:'',phone:'',disease:'',adl:'',tai:'',group:1,cgId:currentUser.cgId||'',relative:'',relPhone:'',status:'active'};
 modal(`<h3>${id?'แก้ไข':'เพิ่ม'}ข้อมูลผู้สูงอายุ / ผู้ป่วย</h3><form class="form" onsubmit="savePat(event,'${id||''}')">
 <label class="full">ชื่อ-สกุล (รวมคำนำหน้า) *<input name="name" required value="${esc(p.name)}"></label>
 <label>เลขบัตรประชาชน 13 หลัก<input name="cid" maxlength="13" inputmode="numeric" value="${esc(p.cid)}"></label>
 <label>เพศ<select name="sex">${['','ชาย','หญิง'].map(s=>`<option ${p.sex===s?'selected':''}>${s}</option>`).join('')}</select></label>
 <label>วันเกิด<input type="date" name="birth" id="pBirth" value="${p.birth||''}"></label>
 <label>หมู่ที่<input name="moo" value="${esc(p.moo)}"></label>
 <label>เบอร์โทรศัพท์<input name="phone" inputmode="tel" value="${esc(p.phone)}"></label>
 <label class="full">ที่อยู่ (บ้านเลขที่/ตำบล/อำเภอ/จังหวัด)<input name="address" value="${esc(p.address)}"></label>
 <label>ละติจูด (Latitude)<input name="lat" id="pLat" inputmode="decimal" placeholder="เช่น 17.123456" value="${esc(p.lat||'')}"></label>
 <label>ลองจิจูด (Longitude)<input name="lng" id="pLng" inputmode="decimal" placeholder="เช่น 101.654321" value="${esc(p.lng||'')}"></label>
 <div class="full gpsbar"><span class="mut">พิกัดบ้าน:</span><button type="button" class="sm sec" onclick="getGPS()">📍 ดึงพิกัด</button><button type="button" class="sm sec" onclick="pasteLL('pLat','pLng')">🗺️ วางพิกัด</button><button type="button" class="sm sec" onclick="pickOnMap('pLat','pLng')">📌 ปักหมุดบนแผนที่</button></div>
 <label class="full">โรคประจำตัว<input name="disease" placeholder="เช่น เบาหวาน, ความดันโลหิตสูง" value="${esc(p.disease)}"></label>
 <label>คะแนน ADL (0-20)<input type="number" min="0" max="20" name="adl" value="${p.adl??''}"></label>
 
 <label>กลุ่มการดูแล<select name="group">${[0,1,2,3,4].map(i=>`<option value="${i}" ${+p.group===i?'selected':''}>${GROUPS[i]}</option>`).join('')}</select></label>
 <label>CG ผู้ดูแล<select name="cgId" ${isCG?'disabled':''}>${cgOpts(p.cgId,'- เลือก CG -')}</select></label>
 <label>ญาติ/ผู้ดูแลหลัก<input name="relative" value="${esc(p.relative||'')}"></label>
 <label>เบอร์โทรญาติ<input name="relPhone" inputmode="tel" value="${esc(p.relPhone||'')}"></label>
 <label>สถานะ<select name="status"><option value="active">อยู่ในความดูแล</option><option value="inactive" ${p.status==='inactive'?'selected':''}>จำหน่าย (เสียชีวิต/ย้าย)</option></select></label>
 <div class="full err" id="perr"></div>
 <div class="full" style="display:flex;gap:10px"><button type="submit">💾 บันทึก</button><button type="button" class="sec" onclick="closeM()">ยกเลิก</button>${id&&!isCG?`<button type="button" class="del" style="margin-left:auto" onclick="delPat('${id}')">ลบ</button>`:''}</div></form>`)}
function savePat(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const err=t=>$('#perr').textContent=t;
 f.cid=(f.cid||'').replace(/\D/g,'');f.name=f.name.trim();
 if(f.cid&&!validCID(f.cid))return err('เลขบัตรประชาชน 13 หลักไม่ถูกต้อง');
 if(f.cid&&db.patients.some(p=>p.cid===f.cid&&p.id!==id))return err('เลขบัตรประชาชนนี้มีในระบบแล้ว');
 if(currentUser.role==='cg')f.cgId=currentUser.cgId;
 f.group=+f.group;f.adl=f.adl===''?'':+f.adl;if(!f.sex)f.sex=guessSex(f.name);
 if(id)Object.assign(P(id),f);else db.patients.push({id:uid(),...f});save();closeM();rPat()}
async function delPat(id){if(currentUser.role!=='admin')return alert('เฉพาะผู้ดูแลระบบเท่านั้นที่ลบได้');const p0=P(id);if(!p0)return;if(!(await askConfirm('ยืนยันลบ "'+p0.name+'" และประวัติ ADL/การเยี่ยมบ้านทั้งหมด?\nลบแล้วกู้คืนไม่ได้ (แนะนำเปลี่ยนสถานะเป็น "จำหน่าย" แทน)')))return;
 db.patients=db.patients.filter(p=>p.id!==id);db.adl=db.adl.filter(x=>x.pid!==id);db.tai=db.tai.filter(x=>x.pid!==id);db.scr=(db.scr||[]).filter(x=>x.pid!==id);db.visits=db.visits.filter(x=>x.pid!==id);Object.values(db.schedules).forEach(s=>delete s.visits[id]);save();closeM();rPat()}

 <div class="tw"><table><tr><th>#</th><th>ชื่อ-สกุล</th><th>เบอร์โทร</th><th>พื้นที่</th><th>ผู้ป่วย</th><th>ภาระงาน/เดือน</th><th class="noprint">จัดการ</th></tr>
 ${db.cgs.map((c,i)=>{const ps=activeP().filter(p=>p.cgId===c.id),a=ps.filter(p=>p.group==1||p.group==2).length,b=ps.filter(p=>p.group>=3).length;return `<tr><td>${i+1}</td><td><b>${esc(c.name)}</b></td><td>${esc(c.phone||'-')}</td><td>${esc(c.area||'-')}</td><td><b>${ps.length}</b> ราย</td><td>เยี่ยม ${a*2+b*4} ครั้ง + เวรศูนย์ 1</td><td style="white-space:nowrap" class="noprint"><button class="sm" onclick="editCg('${c.id}')">แก้ไข</button> <button class="sm sec" onclick="state.cg='${c.id}';go('patients')">รายชื่อ</button></td></tr>`}).join('')}</table></div></div>`)}
function editCg(id){const c=id?db.cgs.find(x=>x.id===id):{name:'',cid:'',phone:'',area:'',note:''};
 modal(`<h3>${id?'แก้ไข':'เพิ่ม'}ข้อมูล CG</h3><form class="form" onsubmit="saveCg(event,'${id||''}')">
 <label class="full">ชื่อ-สกุล CG *<input name="name" required value="${esc(c.name)}"></label>
 <label>เลขบัตรประชาชน<input name="cid" maxlength="13" inputmode="numeric" value="${esc(c.cid||'')}"></label>
 <label>เบอร์โทรศัพท์<input name="phone" inputmode="tel" value="${esc(c.phone||'')}"></label>
 <label class="full">พื้นที่รับผิดชอบ<input name="area" value="${esc(c.area||'')}"></label>
 <label class="full">หมายเหตุ<input name="note" value="${esc(c.note||'')}"></label>

 <div class="full" style="display:flex;gap:10px"><button type="submit">💾 บันทึก</button><button type="button" class="sec" onclick="closeM()">ยกเลิก</button>${id?`<button type="button" class="del" style="margin-left:auto" onclick="delCg('${id}')">ลบ</button>`:''}</div></form>`)}
function saveCg(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.cid=f.cid.replace(/\D/g,'');f.name=f.name.trim();

function holSet(){const s=new Set();(db.settings.holidays||'').split(/\s+/).forEach(l=>{const m=l.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m){let y=+m[1];if(y>2400)y-=543;s.add(`${y}-${pad(m[2])}-${pad(m[3])}`)}});return s}
function workDays(y,m){const n=new Date(y,m,0).getDate(),h=holSet(),r=[];for(let d=1;d<=n;d++){const w=new Date(y,m-1,d).getDay();if(!db.settings.weekend&&(w===0||w===6))continue;if(h.has(`${y}-${pad(m)}-${pad(d)}`))continue;r.push(d)}return r}
async function genSch(){const key=mkey(state.y,state.m);if(db.schedules[key]&&!(await askConfirm('มีตารางเดือนนี้แล้ว ต้องการสร้างใหม่ทับหรือไม่?')))return;
 const days=workDays(state.y,state.m);if(!days.length)return alert('ไม่มีวันทำงานในเดือนนี้');
 const sch={created:new Date().toISOString(),visits:{},duty:{}},n=Math.max(db.cgs.length,1);
 db.cgs.forEach((c,ci)=>sch.duty[c.id]=days[Math.floor((ci+0.5)*days.length/n)%days.length]);
 db.cgs.forEach(c=>{const avail=days.filter(d=>d!==sch.duty[c.id]),ld={};avail.forEach(d=>ld[d]=0);
  activeP().filter(p=>p.cgId===c.id).sort((a,b)=>visitsNeeded(b.group)-visitsNeeded(a.group)).forEach(p=>{const k=visitsNeeded(p.group),got=[];
   for(let j=0;j<k;j++){const lo=Math.floor(j*avail.length/k),hi=Math.max(lo,Math.floor((j+1)*avail.length/k)-1);let best=null;
    for(let i=lo;i<=hi&&i<avail.length;i++){const d=avail[i];if(got.includes(d))continue;if(best===null||ld[d]<ld[best])best=d}
    if(best!==null){got.push(best);ld[best]++}}
   sch.visits[p.id]=got.sort((a,b)=>a-b)})});
 db.schedules[key]=sch;save();rSch()}

function tgDuty(cg,d){if(currentUser.role==='cg')return;const s=db.schedules[mkey(state.y,state.m)];if(!s)return;s.duty[cg]=s.duty[cg]===d?null:d;save();rSch()}

 ${db.cgs.map((c,i)=>{const ps=act.filter(p=>p.cgId===c.id),x=ps.filter(p=>p.group==1||p.group==2).length,y=ps.filter(p=>p.group>=3).length;return `<tr><td>${i+1}</td><td>${esc(c.name)}</td><td>${ps.length}</td><td>${x}</td><td>${y}</td><td><b>${x*2+y*4}</b> + เวรศูนย์ 1</td></tr>`}).join('')}</table></div></div>`)}

/* ---------- SETTINGS ---------- */
function rSet(){const S=db.settings;
 M(`<h2>⚙️ ตั้งค่าระบบ</h2><div class="card"><h3>🏥 ข้อมูล รพ.สต. และเงื่อนไขการเยี่ยม</h3><div class="form">
 <label class="full">ชื่อ รพ.สต. / หน่วยงาน<input id="s0" value="${esc(S.orgName||'')}" placeholder="เช่น รพ.สต.บ้านตัวอย่าง"></label>
 <label class="full">ต้นสังกัด / พื้นที่รับผิดชอบ (แสดงใต้ชื่อในหน้าล็อกอิน)<input id="s7" value="${esc(S.orgSub||'')}" placeholder="เช่น ต.ตัวอย่าง อ.เมือง จ.ตัวอย่าง"></label>
 <label class="full">ที่อยู่ตั้งต้นของผู้ป่วยใหม่<input id="s8" value="${esc(S.defAddr||'')}" placeholder="เช่น ต.ตัวอย่าง อ.เมือง จ.ตัวอย่าง"></label>
 <label>ละติจูดหน่วยบริการ (Latitude)<input id="s5" inputmode="decimal" placeholder="เช่น 17.123456" value="${esc(S.orgLat||'')}"></label>
 <label>ลองจิจูดหน่วยบริการ (Longitude)<input id="s6" inputmode="decimal" placeholder="เช่น 101.654321" value="${esc(S.orgLng||'')}"></label>
 <div class="full gpsbar"><span class="mut">กำหนดพิกัดหน่วยบริการ (แสดงบนแผนที่):</span><button type="button" class="sm sec" onclick="orgGPS()">📍 ดึงพิกัด</button><button type="button" class="sm sec" onclick="pasteLL('s5','s6')">🗺️ วางพิกัด</button><button type="button" class="sm sec" onclick="pickOnMap('s5','s6')">📌 ปักหมุดบนแผนที่</button></div>
 <label>ชม. ต่อการเยี่ยม 1 ครั้ง (ค่าตั้งต้น)<input type="number" id="s1" value="${S.visitHrs}" step="0.5" min="0"></label>
 <label>ชม. เวรประจำศูนย์<input type="number" id="s2" value="${S.dutyHrs}" step="0.5" min="0"></label>
 <label>นับเสาร์-อาทิตย์เป็นวันทำงาน<select id="s3"><option value="0">ไม่นับ</option><option value="1" ${S.weekend?'selected':''}>นับ</option></select></label>
 <label class="full">วันหยุดนักขัตฤกษ์ (บรรทัดละ 1 วัน เช่น 2569-04-13)<textarea id="s4" rows="4">${esc(S.holidays)}</textarea></label></div><br><button onclick="saveSet()">💾 บันทึก</button></div>
 ${credCard()}${gsCard()}<div class="card"><h3>สำรอง/กู้คืนข้อมูล</h3><p class="mut">ข้อมูลเก็บในเบราว์เซอร์ของเครื่องนี้ ควรสำรองเป็นประจำ (ไฟล์สำรองไม่รวมรูปถ่าย รูปเก็บใน Google Drive)</p><div class="toolbar">
 <button onclick="dl('smartcg_backup_'+todayISO()+'.json',JSON.stringify(db),'application/json')">⬇️ สำรองข้อมูล (JSON)</button>
 <label class="btnlike">⬆️ กู้คืนจากไฟล์<input type="file" accept=".json" hidden onchange="restore(this)"></label>
 <button class="sec" onclick="csvPat()">⬇️ รายชื่อผู้ป่วย (CSV)</button>
 <button class="del" onclick="resetAll()">ล้างข้อมูลทั้งหมด</button></div></div>
 <div class="card">ผู้ป่วย ${db.patients.length} • CG ${db.cgs.length} • ADL ${db.adl.length} • เยี่ยมบ้าน ${db.visits.length} รายการ</div>`)}
function saveSet(){Object.assign(db.settings,{orgName:$('#s0').value.trim(),visitHrs:+$('#s1').value||0,dutyHrs:+$('#s2').value||0,weekend:$('#s3').value==='1',holidays:$('#s4').value,orgLat:$('#s5').value.trim(),orgLng:$('#s6').value.trim(),orgSub:$('#s7').value.trim(),defAddr:$('#s8').value.trim()});save();alert('บันทึกการตั้งค่าแล้ว')}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.patients||!d.cgs)throw 0;if(!(await askConfirm('ข้อมูลปัจจุบันจะถูกแทนที่ ยืนยัน?')))return;db=d;db._h=null;normDb();save();load();alert('กู้คืนสำเร็จ');(async()=>{if(gsReady()&&await askConfirm('ส่งข้อมูลที่กู้คืนขึ้น Google Sheet ด้วยหรือไม่?'))await gsPushAll();go('dash')})()}catch(e){alert('ไฟล์ไม่ถูกต้อง')}};r.readAsText(f)}
function csvPat(){const rows=[['ชื่อ-สกุล','เลขบัตรประชาชน','วันเกิด','อายุ','เพศ','หมู่','ที่อยู่','Latitude','Longitude','เบอร์โทร','โรคประจำตัว','ADL','กลุ่ม','CG','ญาติ','เบอร์ญาติ','สถานะ']];
 db.patients.forEach(p=>rows.push([p.name,p.cid?"'"+p.cid:'',p.birth?thDate(p.birth):'',age(p.birth),p.sex,p.moo,p.address,p.lat,p.lng,p.phone,p.disease,p.adl,p.group,cgName(p.cgId),p.relative,p.relPhone,p.status==='inactive'?'จำหน่าย':'อยู่ในความดูแล']));
 dl(`รายชื่อผู้สูงอายุ_${todayISO()}.csv`,toCSV(rows),'text/csv;charset=utf-8')}
async function resetAll(){if((await askPrompt('พิมพ์ RESET เพื่อยืนยันล้างข้อมูลทั้งหมด'))!=='RESET')return;localStorage.removeItem(KEY);localStorage.removeItem(GSS);load();alert('รีเซ็ตเรียบร้อย (ล้างเฉพาะเครื่องนี้ ข้อมูลใน Google Sheet ยังอยู่ และจะถูกดึงกลับมาเมื่อซิงค์)');go('dash');syncNow(true)}
</script>
